<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Farmàcia de Guàrdia · Policia Local SCG</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --blue:   #1a3a6b;
  --blue2:  #2d5a9e;
  --gold:   #e8a800;
  --green:  #27ae60;
  --red:    #c0392b;
  --bg:     #eef1f6;
  --card:   #fff;
  --border: #d8e2f0;
  --text:   #1a1a2e;
  --muted:  #6b7a99;
}

html, body { min-height: 100%; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }

#header {
  background: var(--blue);
  padding: 18px 20px 22px;
  text-align: center;
  position: relative;
}
#header::after {
  content: '';
  display: block;
  position: absolute;
  bottom: -14px; left: 0; right: 0;
  height: 28px;
  background: var(--blue);
  clip-path: ellipse(55% 100% at 50% 0%);
}
.header-title h1 { color: #fff; font-size: 17px; line-height: 1.3; }
.header-title p { color: #c8d8f0; font-size: 11px; margin-top: 2px; }
.back-link {
  position: absolute; top: 14px; left: 14px;
  color: #c8d8f0; font-size: 12px; text-decoration: none;
  padding: 5px 10px; border-radius: 6px; background: rgba(255,255,255,.12);
}
.home-link {
  position: absolute; top: 14px; right: 14px;
  color: #c8d8f0; font-size: 12px; text-decoration: none;
  padding: 5px 10px; border-radius: 6px; background: rgba(255,255,255,.12);
}

#main { max-width: 560px; margin: 0 auto; padding: 30px 16px 50px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 16px;
}

#loading { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 14px; }
#loading .spinner {
  width: 28px; height: 28px; margin: 0 auto 14px;
  border: 3px solid var(--border); border-top-color: var(--blue2);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.today-label {
  display: inline-block; background: var(--green); color: #fff;
  font-size: 11px; font-weight: bold; letter-spacing: .4px;
  padding: 3px 10px; border-radius: 20px; margin-bottom: 10px;
  text-transform: uppercase;
}
.pharmacy-name { font-size: 19px; font-weight: bold; color: var(--blue); margin-bottom: 8px; }
.pharmacy-detail { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; color: var(--text); margin-bottom: 8px; }
.pharmacy-detail .ic { flex-shrink: 0; width: 18px; text-align: center; }
.pharmacy-actions { display: flex; gap: 10px; margin-top: 14px; }
.pharmacy-actions a {
  flex: 1; text-align: center; padding: 11px; border-radius: 8px;
  font-size: 13px; font-weight: bold; text-decoration: none;
}
.call-btn { background: var(--green); color: #fff; }
.map-btn { background: var(--bg); color: var(--blue); border: 1px solid var(--border); }

.upcoming-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 4px 0 10px; }
.upcoming-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.upcoming-item:last-child { border-bottom: none; }
.upcoming-item .date { color: var(--muted); min-width: 90px; }
.upcoming-item .name { flex: 1; padding: 0 8px; }
.upcoming-item a { color: var(--blue2); text-decoration: none; font-weight: bold; }

.status-line { text-align: center; font-size: 11px; color: var(--muted); margin-top: 4px; }
.status-line a { color: var(--blue2); }

.fallback { text-align: center; padding: 10px; }
.fallback p { color: var(--muted); font-size: 13.5px; margin-bottom: 16px; line-height: 1.5; }
.fallback .open-btn {
  display: inline-block; background: var(--blue); color: #fff;
  padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px;
}

#footer { text-align: center; padding: 10px 16px 30px; font-size: 11px; color: var(--muted); }
#footer strong { color: var(--blue); }
</style>
</head>
<body>

<div id="header">
  <a class="back-link" href="index.html">&larr; Eines</a>
  <a class="home-link" href="../index.html">Inici</a>
  <div class="header-title">
    <h1>Farm&agrave;cia de Gu&agrave;rdia</h1>
    <p>Santa Coloma de Gramenet</p>
  </div>
</div>

<div id="main">
  <div id="loading">
    <div class="spinner"></div>
    Consultant disponibilitat...
  </div>
  <div id="content" style="display:none;"></div>
</div>

<div id="footer">
  <strong>Policia Local · Santa Coloma de Gramenet</strong><br>
  Desenvolupat per l'Agent 268 · Prototip
</div>

<script>
(function () {
  var SOURCE_URL = 'https://www.farmacianagues.cat/es/guardias';

  var loadingEl = document.getElementById('loading');
  var contentEl = document.getElementById('content');

  function showContent(html) {
    loadingEl.style.display = 'none';
    contentEl.style.display = 'block';
    contentEl.innerHTML = html;
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function mapsUrl(address) {
    return 'https://www.google.com/maps/search/?api=1&query=' +
      encodeURIComponent(address + ', Santa Coloma de Gramenet');
  }

  function showFallback(reason) {
    var html =
      '<div class="card fallback">' +
      '<p>No s\'ha pogut carregar la informació automàticament' +
      (reason ? ' (' + escapeHtml(reason) + ')' : '') +
      '. Pot ser un tall temporal dels serveis intermediaris.</p>' +
      '<a class="open-btn" href="' + SOURCE_URL + '" target="_blank" rel="noopener">Obrir farmacianagues.cat</a>' +
      '</div>';
    showContent(html);
  }

  function fetchWithTimeout(url, ms) {
    var controller = new AbortController();
    var t = setTimeout(function () { controller.abort(); }, ms);
    return fetch(url, { signal: controller.signal }).then(
      function (res) { clearTimeout(t); return res; },
      function (err) { clearTimeout(t); throw err; }
    );
  }

  function dedupeCards(cards) {
    var seen = {};
    return cards.filter(function (c) {
      var key = c.phone + '|' + c.date;
      if (seen[key]) return false;
      seen[key] = true;
      return true;
    });
  }

  // --- Proveïdor 1: Jina AI Reader (r.jina.ai) — retorna markdown net ---
  function tryJinaReader() {
    var url = 'https://r.jina.ai/' + SOURCE_URL;
    return fetchWithTimeout(url, 8000).then(function (res) {
      if (!res.ok) throw new Error('Jina HTTP ' + res.status);
      return res.text();
    }).then(function (text) {
      var cards = [];
      var re = /(\d{1,2}\s+[A-Za-zÀ-ÿ]+\s+\d{4})[\s\S]{0,60}?##\s*([^\n]+)\n[\s\S]{0,150}?\[([^\]]+)\]\(#maps\)[\s\S]{0,150}?\[[^\]]*\]\(tel:\/{0,2}(\d+)\)/g;
      var m;
      while ((m = re.exec(text)) !== null) {
        cards.push({
          date: m[1].trim(),
          name: m[2].trim(),
          address: m[3].trim(),
          phone: m[4].trim()
        });
      }
      cards = dedupeCards(cards);
      if (!cards.length) throw new Error('Jina: sense dades reconegudes');
      return cards;
    });
  }

  // --- Proveïdor 2 (reserva): allorigins.win — retorna l'HTML original ---
  function tryAllOrigins() {
    var url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(SOURCE_URL);
    return fetchWithTimeout(url, 10000).then(function (res) {
      if (!res.ok) throw new Error('allorigins HTTP ' + res.status);
      return res.text();
    }).then(function (html) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      var telLinks = Array.prototype.slice.call(doc.querySelectorAll('a[href^="tel:"]'));
      var cards = [];

      telLinks.forEach(function (telEl) {
        var candidate = telEl.parentElement;
        var best = candidate;
        var guard = 0;
        while (candidate && candidate.tagName !== 'BODY' && guard < 12) {
          var count = candidate.querySelectorAll('a[href^="tel:"]').length;
          if (count === 1) {
            best = candidate;
            candidate = candidate.parentElement;
          } else {
            break;
          }
          guard++;
        }
        var heading = best.querySelector('h1,h2,h3,h4,h5,h6');
        var mapsLink = best.querySelector('a[href*="maps"]');
        var text = (best.textContent || '').replace(/\s+/g, ' ').trim();
        var dateMatch = text.match(/(\d{1,2}\s+[A-Za-zÀ-ÿ]+\s+\d{4})/);
        if (heading && mapsLink && dateMatch) {
          cards.push({
            name: heading.textContent.trim(),
            address: mapsLink.textContent.trim(),
            phone: telEl.getAttribute('href').replace(/^tel:\/{0,2}/, ''),
            date: dateMatch[1]
          });
        }
      });

      cards = dedupeCards(cards);
      if (!cards.length) throw new Error('allorigins: sense dades reconegudes');
      return cards;
    });
  }

  function renderCards(cards) {
    var today = cards[0];
    var upcoming = cards.slice(1, 6);

    var html = '<div class="card">';
    html += '<span class="today-label">Avui</span>';
    html += '<div class="pharmacy-name">' + escapeHtml(today.name) + '</div>';
    html += '<div class="pharmacy-detail"><span class="ic">&#128205;</span><span>' + escapeHtml(today.address) + '</span></div>';
    html += '<div class="pharmacy-detail"><span class="ic">&#128222;</span><span>' + escapeHtml(today.phone) + '</span></div>';
    html += '<div class="pharmacy-actions">';
    html += '<a class="call-btn" href="tel:' + escapeHtml(today.phone) + '">Trucar</a>';
    html += '<a class="map-btn" href="' + mapsUrl(today.address) + '" target="_blank" rel="noopener">Com arribar</a>';
    html += '</div></div>';

    if (upcoming.length) {
      html += '<div class="card">';
      html += '<div class="upcoming-title">Properes farmàcies de guàrdia</div>';
      upcoming.forEach(function (c) {
        html += '<div class="upcoming-item">';
        html += '<span class="date">' + escapeHtml(c.date) + '</span>';
        html += '<span class="name">' + escapeHtml(c.name) + '</span>';
        html += '<a href="tel:' + escapeHtml(c.phone) + '">Trucar</a>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '<div class="status-line">Actualitzat ara mateix · Font: <a href="' + SOURCE_URL + '" target="_blank" rel="noopener">Farmàcia Nagues</a></div>';
    showContent(html);
  }

  function load() {
    tryJinaReader()
      .catch(function (e1) {
        return tryAllOrigins();
      })
      .then(renderCards)
      .catch(function (e2) {
        showFallback(e2 && e2.message);
      });
  }

  load();
})();
</script>

</body>
</html>
