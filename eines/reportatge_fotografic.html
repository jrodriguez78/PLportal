<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reportatge Fotogràfic · Policia Local SCG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --blue:   #1a3a6b;
  --blue2:  #2d5a9e;
  --gold:   #e8a800;
  --green:  #27ae60;
  --red:    #c0392b;
  --bg:     #eef1f6;
  --card:   #fff;
  --border: #d8e2f0;
  --text:   #1a1a2e;
  --muted:  #6b7a99;
}

html, body { min-height: 100%; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }

#header {
  background: var(--blue);
  padding: 18px 20px 22px;
  text-align: center;
  position: relative;
}
#header::after {
  content: '';
  display: block;
  position: absolute;
  bottom: -14px; left: 0; right: 0;
  height: 28px;
  background: var(--blue);
  clip-path: ellipse(55% 100% at 50% 0%);
}
.header-title h1 { color: #fff; font-size: 17px; line-height: 1.3; }
.header-title p { color: #c8d8f0; font-size: 11px; margin-top: 2px; }
.back-link {
  position: absolute; top: 14px; left: 14px;
  color: #c8d8f0; font-size: 12px; text-decoration: none;
  padding: 5px 10px; border-radius: 6px; background: rgba(255,255,255,.12);
}
.home-link {
  position: absolute; top: 14px; right: 14px;
  color: #c8d8f0; font-size: 12px; text-decoration: none;
  padding: 5px 10px; border-radius: 6px; background: rgba(255,255,255,.12);
}

#main { max-width: 640px; margin: 0 auto; padding: 30px 16px 60px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.card h2 {
  font-size: 14px;
  color: var(--blue);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: .4px;
}

.field-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.field { flex: 1; min-width: 140px; }
.field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select {
  width: 100%; padding: 9px 10px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 14px; color: var(--text); background: #fbfcfe;
}
.field input:focus, .field select:focus, textarea:focus { outline: 2px solid var(--blue2); outline-offset: -1px; }

.upload-zone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 26px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  background: #fbfcfe;
}
.upload-zone.drag { border-color: var(--blue2); color: var(--blue2); background: #eef4fc; }
.upload-zone .big { font-size: 28px; display: block; margin-bottom: 6px; }
#fileInput { display: none; }

.photo-item {
  display: flex; gap: 12px; padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.photo-item:last-child { border-bottom: none; }
.photo-item img {
  width: 84px; height: 84px; object-fit: cover; border-radius: 8px;
  border: 1px solid var(--border); flex-shrink: 0;
}
.photo-item .info { flex: 1; min-width: 0; }
.photo-item .info .idx { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.photo-item textarea {
  width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px; font-family: Arial, sans-serif; resize: vertical;
}
.photo-item .actions { display: flex; gap: 6px; margin-top: 6px; }
.photo-item .actions button {
  border: none; background: var(--bg); color: var(--muted);
  font-size: 12px; padding: 5px 9px; border-radius: 6px; cursor: pointer;
}
.photo-item .actions button.danger { color: var(--red); }
.photo-item .actions button:active { transform: scale(0.96); }

.empty-hint { text-align: center; color: var(--muted); font-size: 13px; padding: 16px 0; }

.btn-primary {
  width: 100%; padding: 14px; background: var(--blue); color: #fff;
  border: none; border-radius: 10px; font-size: 15px; font-weight: bold;
  cursor: pointer; letter-spacing: .3px;
}
.btn-primary:disabled { background: #a9b6cc; cursor: not-allowed; }
.btn-primary:active:not(:disabled) { transform: scale(0.99); }

.status { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 16px; }

#footer { text-align: center; padding: 10px 16px 30px; font-size: 11px; color: var(--muted); }
#footer strong { color: var(--blue); }
</style>
</head>
<body>

<div id="header">
  <a class="back-link" href="index.html">&larr; Eines</a>
  <a class="home-link" href="../index.html">Inici</a>
  <div class="header-title">
    <h1>Reportatge Fotogràfic</h1>
    <p>Generador de PDF per a reportatges d'actuacions</p>
  </div>
</div>

<div id="main">

  <div class="card">
    <h2>Dades del reportatge</h2>
    <div class="field-row">
      <div class="field" style="flex: 1 0 100%;">
        <label>Assumpte / Títol del reportatge</label>
        <input type="text" id="assumpte" placeholder="Ex: Accident de trànsit amb danys materials">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Expedient / Atestat núm.</label>
        <input type="text" id="expedient" placeholder="Ex: 1234/2026">
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="data">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Agent</label>
        <input type="text" id="agent" placeholder="Ex: Agent 268">
      </div>
      <div class="field">
        <label>Fotos per pàgina</label>
        <select id="layout">
          <option value="1">1 per pàgina</option>
          <option value="2">2 per pàgina (s'adapta sola)</option>
          <option value="4" selected>4 per pàgina</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Fotografies</h2>
    <div class="upload-zone" id="uploadZone">
      <span class="big">📷</span>
      Toca per afegir fotos, o arrossega-les aquí
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div id="photoList"></div>
    <div class="empty-hint" id="emptyHint">Encara no has afegit cap fotografia.</div>
  </div>

  <button class="btn-primary" id="generateBtn" disabled>Generar PDF</button>
  <div class="status" id="status"></div>

</div>

<div id="footer">
  <strong>Policia Local · Santa Coloma de Gramenet</strong><br>
  Desenvolupat per l'Agent 268 · Prototip
</div>

<script>
(function () {
  var photos = []; // { id, dataUrl, w, h, caption }
  var nextId = 1;

  var uploadZone = document.getElementById('uploadZone');
  var fileInput = document.getElementById('fileInput');
  var photoList = document.getElementById('photoList');
  var emptyHint = document.getElementById('emptyHint');
  var generateBtn = document.getElementById('generateBtn');
  var statusEl = document.getElementById('status');

  var dataInput = document.getElementById('data');
  var today = new Date();
  dataInput.value = today.toISOString().slice(0, 10);

  uploadZone.addEventListener('click', function () { fileInput.click(); });
  uploadZone.addEventListener('dragover', function (e) { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', function () { uploadZone.classList.remove('drag'); });
  uploadZone.addEventListener('drop', function (e) {
    e.preventDefault();
    uploadZone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', function () {
    handleFiles(fileInput.files);
    fileInput.value = '';
  });

  function handleFiles(fileListRaw) {
    var files = Array.prototype.slice.call(fileListRaw).filter(function (f) {
      return f.type.indexOf('image/') === 0;
    });
    files.forEach(processFile);
  }

  function processFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement('canvas');
        var maxDim = 1600;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        photos.push({
          id: nextId++,
          dataUrl: dataUrl,
          w: canvas.width,
          h: canvas.height,
          caption: ''
        });
        renderList();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderList() {
    photoList.innerHTML = '';
    emptyHint.style.display = photos.length ? 'none' : 'block';
    generateBtn.disabled = photos.length === 0;

    photos.forEach(function (p, idx) {
      var item = document.createElement('div');
      item.className = 'photo-item';

      var img = document.createElement('img');
      img.src = p.dataUrl;
      item.appendChild(img);

      var info = document.createElement('div');
      info.className = 'info';

      var idxLabel = document.createElement('div');
      idxLabel.className = 'idx';
      idxLabel.textContent = 'Foto ' + (idx + 1) + ' de ' + photos.length;
      info.appendChild(idxLabel);

      var textarea = document.createElement('textarea');
      textarea.placeholder = 'Peu de foto...';
      textarea.value = p.caption;
      textarea.addEventListener('input', function () { p.caption = textarea.value; });
      info.appendChild(textarea);

      var actions = document.createElement('div');
      actions.className = 'actions';

      var upBtn = document.createElement('button');
      upBtn.textContent = '↑ Amunt';
      upBtn.disabled = idx === 0;
      upBtn.addEventListener('click', function () { moveItem(idx, -1); });
      actions.appendChild(upBtn);

      var downBtn = document.createElement('button');
      downBtn.textContent = '↓ Avall';
      downBtn.disabled = idx === photos.length - 1;
      downBtn.addEventListener('click', function () { moveItem(idx, 1); });
      actions.appendChild(downBtn);

      var delBtn = document.createElement('button');
      delBtn.className = 'danger';
      delBtn.textContent = '✕ Eliminar';
      delBtn.addEventListener('click', function () { removeItem(idx); });
      actions.appendChild(delBtn);

      info.appendChild(actions);
      item.appendChild(info);
      photoList.appendChild(item);
    });
  }

  function moveItem(idx, dir) {
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= photos.length) return;
    var tmp = photos[idx];
    photos[idx] = photos[newIdx];
    photos[newIdx] = tmp;
    renderList();
  }

  function removeItem(idx) {
    photos.splice(idx, 1);
    renderList();
  }

  generateBtn.addEventListener('click', function () {
    if (!photos.length) return;
    generateBtn.disabled = true;
    statusEl.textContent = 'Generant PDF...';
    setTimeout(function () {
      try {
        buildPdf();
        statusEl.textContent = 'PDF generat correctament.';
      } catch (err) {
        statusEl.textContent = 'Error generant el PDF: ' + err.message;
      }
      generateBtn.disabled = false;
    }, 50);
  });

  function buildPdf() {
    var jsPDFCtor = window.jspdf.jsPDF;
    var doc = new jsPDFCtor({ unit: 'mm', format: 'a4', orientation: 'portrait' });

    var pageW = 210, pageH = 297;
    var margin = 14;
    var contentW = pageW - margin * 2;

    var layout = parseInt(document.getElementById('layout').value, 10);
    var assumpte = document.getElementById('assumpte').value.trim();
    var expedient = document.getElementById('expedient').value.trim();
    var dataVal = document.getElementById('data').value;
    var agent = document.getElementById('agent').value.trim();

    var dataFmt = '';

    var logoRatio = 314 / 66;
    var logoH = 8, logoW = logoH * logoRatio;

    function drawHeader(isFirstPage) {
      doc.addImage(logoDataUrl, 'PNG', margin, 10, logoW, logoH);
      doc.setDrawColor(210, 216, 224);
      doc.setLineWidth(0.3);
      doc.line(margin, 20, pageW - margin, 20);

      if (isFirstPage) {
        doc.setFontSize(18);
        doc.setTextColor(26, 58, 107);
        doc.setFont(undefined, 'bold');
        doc.text('REPORTATGE FOTOGRÀFIC', pageW / 2, 30, { align: 'center' });

        var cursorY = 36;

        if (assumpte) {
          doc.setFontSize(12.5);
          doc.setTextColor(45, 90, 158);
          doc.setFont(undefined, 'bold');
          var assumpteLines = doc.splitTextToSize(assumpte, contentW - 10);
          doc.text(assumpteLines, pageW / 2, cursorY, { align: 'center' });
          cursorY += assumpteLines.length * 5.5 + 2;
        }

        doc.setFontSize(9.5);
        doc.setTextColor(90, 90, 95);
        doc.setFont(undefined, 'normal');
        var infoLine = [];
        if (expedient) infoLine.push('Expedient: ' + expedient);
        if (dataFmt) infoLine.push('Data: ' + dataFmt);
        if (agent) infoLine.push('Agent: ' + agent);
        if (infoLine.length) {
          doc.text(infoLine.join('   ·   '), pageW / 2, cursorY, { align: 'center' });
          cursorY += 6;
        }
        return cursorY + 2;
      }
      return 26;
    }

    function drawFooter(pageNum, totalPages) {
      doc.setDrawColor(210, 216, 224);
      doc.setLineWidth(0.3);
      doc.line(margin, pageH - 14, pageW - margin, pageH - 14);
      doc.setFontSize(8);
      doc.setTextColor(120, 120, 125);
      doc.setFont(undefined, 'normal');
      doc.text(
        'Policia Local de Santa Coloma de Gramenet   ·   Pàgina ' + pageNum + ' de ' + totalPages,
        pageW / 2, pageH - 9, { align: 'center' }
      );
    }

    function drawPhotoBox(p, x, y, boxW, boxH) {
      var ratio = p.w / p.h;
      var drawW = boxW, drawH = boxW / ratio;
      if (drawH > boxH) { drawH = boxH; drawW = boxH * ratio; }
      var dx = x + (boxW - drawW) / 2;
      var dy = y + (boxH - drawH) / 2;
      doc.setDrawColor(180, 180, 185);
      doc.setLineWidth(0.2);
      doc.rect(x, y, boxW, boxH);
      doc.addImage(p.dataUrl, 'JPEG', dx, dy, drawW, drawH);
      return boxH;
    }

    function drawCaption(text, x, y, w) {
      doc.setFontSize(9.5);
      doc.setTextColor(34, 34, 34);
      doc.setFont(undefined, 'bold');
      var label = 'Peu de foto: ';
      doc.text(label, x, y);
      var labelW = doc.getTextWidth(label);
      doc.setFont(undefined, 'italic');
      doc.setTextColor(107, 107, 110);
      var body = text && text.trim() ? text.trim() : '(sense descripció)';
      var lines = doc.splitTextToSize(body, w - labelW);
      doc.text(lines, x + labelW, y);
      return lines.length * 4.2;
    }

    // Precompute pages
    var groups = [];
    for (var i = 0; i < photos.length; i += layout) {
      groups.push(photos.slice(i, i + layout));
    }
    var totalPages = groups.length;

    groups.forEach(function (group, pageIdx) {
      if (pageIdx > 0) doc.addPage();
      var top = drawHeader(pageIdx === 0);
      var bottom = pageH - 18;
      var availH = bottom - top;

      if (layout === 1) {
        var boxW = contentW, boxH = availH - 12;
        drawPhotoBox(group[0], margin, top, boxW, boxH);
        drawCaption(group[0].caption, margin, top + boxH + 6, boxW);
      } else if (layout === 2) {
        // Detecta si les fotos d'aquesta pàgina són majoritàriament apaïsades (horitzontals)
        // o verticals, i tria la disposició que millor aprofita l'espai.
        var ratios = group.map(function (p) { return p.w / p.h; });
        var avgRatio = ratios.reduce(function (a, b) { return a + b; }, 0) / ratios.length;
        var landscape = avgRatio >= 1;

        if (landscape) {
          // Apilades a tota l'amplada (una a sobre de l'altra)
          var gapV = 8;
          var captionSpace = 10;
          var boxWv = contentW;
          var boxHv = (availH - captionSpace * group.length - gapV * (group.length - 1)) / group.length;
          group.forEach(function (p, i) {
            var y = top + i * (boxHv + captionSpace + gapV);
            drawPhotoBox(p, margin, y, boxWv, boxHv);
            drawCaption(p.caption, margin, y + boxHv + 6, boxWv);
          });
        } else {
          // Costat a costat (com fins ara, ideal per a fotos verticals)
          var gap = 6;
          var boxW2 = (contentW - gap) / 2;
          var boxH2 = availH - 12;
          group.forEach(function (p, i) {
            var x = margin + i * (boxW2 + gap);
            drawPhotoBox(p, x, top, boxW2, boxH2);
            drawCaption(p.caption, x, top + boxH2 + 6, boxW2);
          });
        }
      } else {
        var gapX = 6, gapY = 14;
        var boxW4 = (contentW - gapX) / 2;
        var boxH4 = (availH - gapY - 12) / 2;
        var positions = [
          { x: margin, y: top },
          { x: margin + boxW4 + gapX, y: top },
          { x: margin, y: top + boxH4 + gapY },
          { x: margin + boxW4 + gapX, y: top + boxH4 + gapY }
        ];
        group.forEach(function (p, i) {
          var pos = positions[i];
          drawPhotoBox(p, pos.x, pos.y, boxW4, boxH4);
          drawCaption(p.caption, pos.x, pos.y + boxH4 + 6, boxW4);
        });
      }

      drawFooter(pageIdx + 1, totalPages);
    });

    var fname = 'Reportatge';
    if (expedient) fname += '_' + expedient.replace(/[^a-zA-Z0-9]/g, '');
    if (dataVal) fname += '_' + dataVal;
    doc.save(fname + '.pdf');
  }
