<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a3a6b">
<title>Tipus de Punt · OAC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<style>
:root{--blue:#1a3a6b;--blue2:#2d5a9e;--blue3:#e8f0fb;--bg:#f0f2f5;--card:#fff;--border:#dde4f0;--text:#1a1a2e;--muted:#777;--tag-bg:#fef3c7;--tag-text:#92400e;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:Arial,sans-serif;color:var(--text);}
body{background:var(--bg);display:flex;flex-direction:column;}

/* Header */
#header{background:var(--blue);padding:10px 16px 8px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;}
#header-text{flex:1;min-width:0;}
#header h1{color:#fff;font-size:14px;line-height:1.3;}
#header p{color:#c8d8f0;font-size:10px;margin-top:2px;}
.hbtn{padding:7px 12px;border:none;border-radius:5px;background:#4a7ab5;color:#fff;font-size:12px;font-weight:bold;cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0;}
.hbtn:active{background:#3a6aa5;}

/* Search */
#search-wrap{background:#fff;padding:10px 14px 8px;flex-shrink:0;border-bottom:1px solid var(--border);box-shadow:0 2px 6px rgba(0,0,0,.06);}
.sbox{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
#search-input{flex:1;padding:11px 14px;border:2px solid var(--border);border-radius:8px;font-size:16px;font-family:Arial,sans-serif;color:var(--text);}
#search-input:focus{outline:none;border-color:var(--blue);}
#search-input::placeholder{color:#aaa;}
#btn-clear{flex-shrink:0;width:36px;height:36px;border:none;border-radius:50%;background:#eee;color:#555;font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;}
#btn-clear.vis{display:flex;}
#btn-search{flex-shrink:0;padding:0 16px;height:42px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-size:13px;font-weight:bold;cursor:pointer;}

/* Mode tabs */
.mode-row{display:flex;gap:6px;}
.mbtn{flex:1;padding:7px 4px;border:1.5px solid var(--border);border-radius:7px;background:#fff;color:var(--muted);font-size:12px;font-weight:bold;cursor:pointer;font-family:Arial,sans-serif;transition:all .15s;}
.mbtn.active{background:var(--blue);border-color:var(--blue);color:#fff;}

/* Stats bar */
#stats-bar{padding:5px 14px;font-size:11px;color:var(--muted);background:#f8f9fa;border-bottom:1px solid #eee;flex-shrink:0;min-height:26px;display:flex;align-items:center;}

/* Scrollable results */
#view-results{flex:1;overflow-y:auto;padding:10px 14px 40px;-webkit-overflow-scrolling:touch;}

/* Empty states */
#empty-start{text-align:center;padding:44px 16px 24px;color:var(--muted);}
#empty-start .icon{font-size:40px;margin-bottom:10px;}
#empty-start h2{font-size:15px;color:var(--blue);margin-bottom:8px;}
#empty-start p{font-size:13px;line-height:1.6;}
.quick-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
.qchip{background:#e8effc;border:none;color:var(--blue);border-radius:16px;padding:7px 14px;font-size:12px;font-weight:bold;cursor:pointer;}
.qchip:active{background:#c8d8f0;}
#no-results{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;display:none;}

/* Cards - flat results */
.cards-flat{display:flex;flex-direction:column;gap:6px;}
.punt-card{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;}
.punt-card:hover{box-shadow:0 4px 16px rgba(26,58,107,.10);border-color:var(--blue2);}
.punt-nom{font-size:13px;font-weight:bold;line-height:1.35;margin-bottom:3px;}
.punt-def{font-size:12px;color:#8899aa;line-height:1.5;margin-bottom:5px;}
.punt-tag{display:inline-block;font-size:10px;font-weight:bold;padding:3px 9px;border-radius:12px;background:var(--tag-bg);color:var(--tag-text);}

/* Accordion */
.acc-section{background:var(--card);border:1.5px solid var(--border);border-radius:10px;margin-bottom:6px;overflow:hidden;}
.acc-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.acc-hdr:hover{background:var(--blue3);}
.acc-prefix{flex-shrink:0;font-size:10px;font-weight:bold;padding:3px 8px;border-radius:5px;background:var(--tag-bg);color:var(--tag-text);letter-spacing:.04em;}
.acc-title{flex:1;font-size:13px;font-weight:bold;min-width:0;line-height:1.3;}
.acc-count{flex-shrink:0;font-size:11px;color:var(--muted);}
.acc-arr{flex-shrink:0;color:#c0cce0;font-size:18px;transition:transform .2s;}
.acc-section.open .acc-arr{transform:rotate(90deg);}
.acc-body{display:none;border-top:1px solid #eef0f8;padding:8px 10px 10px;background:#f9fafd;}
.acc-section.open .acc-body{display:block;}
.cards-inner{display:flex;flex-direction:column;gap:5px;}
.punt-inner{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.punt-inner:hover{border-color:var(--blue2);}

mark{background:rgba(232,168,0,.35);color:inherit;border-radius:2px;padding:0 1px;}
</style>
</head>
<body>

<div id="header">
  <div id="header-text">
    <h1>Tipus de Punt</h1>
    <p>Aplicació Atestats i Denúncies &middot; 427 tipus &middot; 43 famílies</p>
  </div>
  <a class="hbtn" href="index.html">&larr; OAC</a>
</div>

<div id="search-wrap">
  <div class="sbox">
    <input type="text" id="search-input"
      placeholder="Cerca: metro, hospital, bar, escola…"
      autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search"
      onkeydown="if(event.key==='Enter'){doSearch();this.blur();}">
    <button id="btn-clear" onclick="clearSearch()">✕</button>
    <button id="btn-search" onclick="doSearch()">Cerca</button>
  </div>
  <div class="mode-row">
    <button class="mbtn active" id="btn-mode-search" onclick="setMode('search')">🔍 Cerca lliure</button>
    <button class="mbtn" id="btn-mode-browse" onclick="setMode('browse')">📂 Per família</button>
  </div>
</div>

<div id="stats-bar"><span id="stats-txt"></span></div>

<div id="view-results">
  <div id="empty-start">
    <div class="icon">📍</div>
    <h2>Tipus de Punt</h2>
    <p>Escriu on s'han produït els fets o navega per família.</p>
    <div class="quick-chips">
      <button class="qchip" onclick="quickSearch('metro')">Metro</button>
      <button class="qchip" onclick="quickSearch('hospital')">Hospital</button>
      <button class="qchip" onclick="quickSearch('bar')">Bar</button>
      <button class="qchip" onclick="quickSearch('escola')">Escola</button>
      <button class="qchip" onclick="quickSearch('domicili')">Domicili</button>
      <button class="qchip" onclick="quickSearch('carretera')">Carretera</button>
    </div>
  </div>
  <div id="no-results">Cap tipus de punt trobat per aquesta cerca.</div>
  <div id="cards-list"></div>
</div>

<script>
const DB=[{"familia":"CEN-Centres Associatius","tipus":"Associació de Cànnabis","def":"Local amb els mitjans necessaris perquè exerceixin les seves funcions les associacions de cànnabis."},{"familia":"CEN-Centres Associatius","tipus":"Associació de Veïns","def":"Local amb els mitjans necessaris perquè exerceixin les seves funcions les associacions de veïns."},{"familia":"CEN-Centres Associatius","tipus":"Associacions altres","def":"Local amb els mitjans necessaris perquè exerceixin les seves funcions les diferents tipus d'associacions."},{"familia":"CEN-Centres Culturals","tipus":"Auditori","def":"És l'àrea dintre d'un teatre, sala de concerts o un altre espai d'actuació on l'audiència escolta i veu la interpretació."},{"familia":"CEN-Centres Culturals","tipus":"Biblioteca","def":"Edifici o lloc que conté llibres, publicacions periòdiques o altres documents, organitzats segons sistemes preestablerts i destinats a servir al públic amb servei de préstec."},{"familia":"CEN-Centres Educatius","tipus":"Acadèmia","def":"Establiment d’ensenyament de caràcter privat."},{"familia":"CEN-Centres Educatius","tipus":"Centre de F.Personal de seguretat privada","def":"Centre docent habilitat per impartir formació a personal de seguretat privada."},{"familia":"CEN-Centres Educatius","tipus":"Centre de F.Personal de control d'accés","def":"Centre docent habilitat per impartit formació a personal de control d'accés."},{"familia":"CEN-Centres Educatius","tipus":"Centre de F.Professional","def":"Organisme que ofereix i coordina els estudis de formació professional."},{"familia":"CEN-Centres Educatius","tipus":"Escola","def":"Institució o centre de primària encarregat d'educar o impartir docència sobre unes determinades àrees, de caràcter obligatori."},{"familia":"CEN-Centres Educatius","tipus":"Institut","def":"Establiment on s’imparteixen ensenyaments secundaris o superiors."},{"familia":"CEN-Centres Educatius","tipus":"Llar d'Infants","def":"Centre on es té cura d’infants d’edat preescolar."},{"familia":"CEN-Centres Educatius","tipus":"Universitat","def":"Edifici o edificies destinats a l'institució docent integrada per diferents centres on són impartits els estudis superiors de les diverses branques del saber i són atorgats els títols corresponents."},{"familia":"CEN-Centres Esportius","tipus":"Camp de futbol","def":"Recinte on es disputen partits de futbol. Inclou la graderia, vestuaris, etc."},{"familia":"CEN-Centres Esportius","tipus":"Circuit curses a motor","def":"Recorregut tancat on es disputen curses a motor."},{"familia":"CEN-Centres Esportius","tipus":"Estació d'esquí","def":"Instal·lació apta per a la pràctica dels esports de neu."},{"familia":"CEN-Centres Esportius","tipus":"Instal·lació esportiva","def":"Ubicació en un local o espai per al desenvolupament de diverses activitats esportives."},{"familia":"CEN-Centres Esportius","tipus":"Pavelló esportiu","def":"Construcció aïllada on es desenvolupen diverses activitats esportives."},{"familia":"CEN-Centres Oficials","tipus":"ACD (NOMÉS ÚS SISD)","def":"Lloc destinat a la custòdia de detinguts (només relacionat amb l'aplicació del SISD)."},{"familia":"CEN-Centres Oficials","tipus":"Ambaixada","def":"Edifici on hi ha una delegació representativa oficial i generalment permanent d'un estat en un altre, sovint a la seva capital, cosa que les distingeix dels consolats."},{"familia":"CEN-Centres Oficials","tipus":"Centre de menors","def":"Entitats administratives i funcionals, amb organització pròpia, destinada a l'atenció socioeducativa individualitzada i a la custòdia de menors i joves."},{"familia":"CEN-Centres Oficials","tipus":"Centre penitenciari","def":"Lloc d'internament per a persones que han estat privades de llibertat, ja sigui perquè estan condemnats o perquè se'ls ha aplicat una mesura cautelar/preventiva."},{"familia":"CEN-Centres Oficials","tipus":"Consolat","def":"Edifici o part d'un edifici on hi ha l'oficina de l'agent diplomàtic encarregat pel govern d’un estat de protegir, en una ciutat estrangera, els interessos dels seus nacionals."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Fiscalia","def":"Equipament públic amb els serveis administratius i operacionals necessaris per a les tasques de la fiscalia."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Govern Autonòmic","def":"Espai destinat a exercir les funcions pròpies d'un govern autonòmic."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Govern Comarcal","def":"Espai destinat a exercir les funcions de les entitats comarcals."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Govern Estatal","def":"Espai destinat a exercir les funcions pròpies del Govern de l'Estat."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Govern Local","def":"Espai destinat a exercir les funcions de l'administració local."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Govern Provincial","def":"Espai destinat a exercir les funcions de l'administració provincial. Diputacions."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Guàrdia Civil","def":"Equipament públic amb serveis administratius i operacionals de la Guàrdia Civil."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Judicial","def":"Equipament públic amb els serveis administratius i operacionals necessaris per a tasques judicials."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Mossos d'Esquadra","def":"Equipament públic amb serveis administratius i operacionals del cos de Mossos d'Esquadra."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Policia Local","def":"Equipament públic amb serveis administratius i operacionals de la policia local."},{"familia":"CEN-Centres Oficials","tipus":"Depen. Policia Nacional","def":"Equipament públic amb serveis administratius i operacionals de la Policia Nacional."},{"familia":"CEN-Centres Oficials","tipus":"Dependència Militar","def":"Equipament públic amb serveis administratius i operacionals de l'exercit."},{"familia":"CEN-Centres Oficials","tipus":"Registre Civil","def":"Oficina pública on consta l'existència de l'estat civil dels ciutadans i s'inscriuen els diferents actes."},{"familia":"CEN-Centres Oficials","tipus":"Registre de la Propietat","def":"Oficina pública on consta l'existència relativa al domini i als drets reals sobre els béns immobles."},{"familia":"CEN-Centres Oficials","tipus":"Registre Mercantil","def":"Oficina pública que té per objecte la publicitat oficial de les situacions jurídiques dels empresaris registrats."},{"familia":"CEN-Centres Oficials","tipus":"Servei d'ocupació","def":"Oficina pública que ofereix els seus serveis a les persones que busquen feina, tant si estan en actiu com en situació d'atur i a les empreses"},{"familia":"CEN-Centres Oficials","tipus":"Serveis socials","def":"Entitats administratives i funcionals, amb organització pròpia, destinada a l'assistència i prestació de serveis socials."},{"familia":"CEN-Centres polítics/laborals","tipus":"Partit polític","def":"Seu de l'organització política que té com a objectiu la consecució del poder per tal d’aplicar un programa de govern."},{"familia":"CEN-Centres polítics/laborals","tipus":"Sindicat","def":"Seu de l'associació formada per a la defensa dels interessos econòmics i socials comuns a tots els associats, especialment associació obrera."},{"familia":"CEN-Centres Religiosos","tipus":"Centre religiós altres","def":"Local on es trobem persones de creences i conviccions, d'actituds i sentiments anàlogues."},{"familia":"CEN-Centres Religiosos","tipus":"Centre religiós Budista","def":"Local on es trobem persones de creences i conviccions, d'actituds i sentiments que se senten vinculades a la religió Budista."},{"familia":"CEN-Centres Religiosos","tipus":"Centre religiós Catòlic","def":"Local on es trobem persones de creences i conviccions, d'actituds i sentiments que se senten vinculades a la religió Catòlica."},{"familia":"CEN-Centres Religiosos","tipus":"Centre religiós Evangèlic","def":"Local on es trobem persones de creences i conviccions, d'actituds i sentiments que se senten vinculades a la religió Evangèlica."},{"familia":"CEN-Centres Religiosos","tipus":"Centre religiós Hinduista","def":"Local on es trobem persones de creences i conviccions, d'actituds i sentiments que se senten vinculades a la religió Hinduista."},{"familia":"CEN-Centres Religiosos","tipus":"Centre religiós Islàmic","def":"Local on es trobem persones de creences i conviccions, d'actituds i sentiments que se senten vinculades a la religió Islàmica."},{"familia":"CEN-Centres Religiosos","tipus":"Centre religiós Mormons","def":"Local on es trobem persones de creences i conviccions, d'actituds i sentiments que se senten vinculades a la religió Mormona."},{"familia":"CEN-Centres Religiosos","tipus":"Centre religiós Testimonis de Jehovà","def":"Local on es trobem persones de creences i conviccions, d'actituds i sentiments que se senten vinculades a la religió dels Testimonis de Jehovà."},{"familia":"CEN-Centres Sanitaris","tipus":"Centre d'Atenció Primària","def":"Centre públic de salut on la població és atesa en un primer nivell assistencial."},{"familia":"CEN-Centres Sanitaris","tipus":"Centre de Venopunció","def":"Establiment sanitari destinat a la recollida de sang d'una vena, generalment presa per un laboratorista, personal paramèdic, personal d'infermeria, un metge, o un estudiant d'aquestes professions"},{"familia":"CEN-Centres Sanitaris","tipus":"Centre mèdic","def":"Centre sanitari on es rep assistència sanitària de primer nivell."},{"familia":"CEN-Centres Sanitaris","tipus":"Clínica","def":"Establiment sanitari on es fan determinats tractaments mèdics."},{"familia":"CEN-Centres Sanitaris","tipus":"CSA (Només ús SISD)","def":"Centre sanitari (només utilitzar en cas de relacionar amb l'aplicació SISD)."},{"familia":"CEN-Centres Sanitaris","tipus":"Hospital","def":"Establiment on es proporciona assistència mèdica i sanitària completa, que generalment és també un centre de formació de personal sanitari."},{"familia":"CEN-Centres Sanitaris","tipus":"Psiquiàtric","def":"Centre on es tracta els desordres i les malalties mentals."},{"familia":"CEN-Centres Socials","tipus":"Banc d'aliments","def":"Establiment de caràcter solidari que gestiona la donació d'aliments per fer una distribució equitativa entre les persones necessitades."},{"familia":"CEN-Centres Socials","tipus":"Casal d'avis","def":"Entitat de caràcter popular amb finalitats culturals, recreatives, polítiques o religioses."},{"familia":"CEN-Centres Socials","tipus":"Centre de dia/Residència gent gran","def":"Edifici on conviuen habitualment persones grans, sota una reglamentació comuna."},{"familia":"EMP-Agricultura, Ramaderia i Pesca","tipus":"Explotació agrícola empresarial","def":"Conjunt d'instal·lacions i activitats aplicades al funcionament d'una empresa agrícola."},{"familia":"EMP-Agricultura, Ramaderia i Pesca","tipus":"Explotació agrícola familiar","def":"Conjunt d'instal·lacions i activitats, dins de l'àmbit familiar, aplicades al funcionament d'una activitat agrícola destinada a un cercle reduït comercial."},{"familia":"EMP-Agricultura, Ramaderia i Pesca","tipus":"Explotació aqüícola/piscifactoria","def":"Conjunt d'instal·lacions i activitats, tècniques i coneixements de criança d'espècies aquàtiques tant vegetals com animals. Destinada a la producció d'aliments, matèries primeres d'ús industrial i farmacèutic, i organismes vius per la seva repoblació o ornamentació."},{"familia":"EMP-Agricultura, Ramaderia i Pesca","tipus":"Explotació ramadera empresarial","def":"Conjunt d'instal·lacions i activitats aplicades al funcionament d'una empresa ramadera."},{"familia":"EMP-Agricultura, Ramaderia i Pesca","tipus":"Explotació ramadera familiar","def":"Conjunt d'instal·lacions i activitats, dins de l'àmbit familiar, aplicades al funcionament d'una activitat ramadera destinada a un cercle reduït comercial."},{"familia":"EMP-Agricultura, Ramaderia i Pesca","tipus":"Infraestructura agrària","def":"Conjunt d’elements que formen la infraestructura fonamentals per al desenvolupament d’aquesta activitat agrària. Per exemple el sistema de rec"},{"familia":"EMP-Agricultura, Ramaderia i Pesca","tipus":"Magatzem rural","def":"Magatzem destinada a emmagatzemar eines, maquinària i/o altres objectes ubicada en zona rural."},{"familia":"EMP-Agricultura, Ramaderia i Pesca","tipus":"Maquinària/equips/eines agràries","def":"Màquines, accessoris necessaris per acoblar a les màquines i eines característiques per poder desenvolupar tasques al sector agrícola."},{"familia":"EMP-Agricultura, Ramaderia i Pesca","tipus":"Parc eòlic i fotovoltaic agrari","def":"Indret terrestre o marítim, on hi ha una agrupació d'aerogeneradors i/o panells fotovoltaics que produeixen energia elèctrica destinada a les zones agrícoles, ramaderes i zones properes."},{"familia":"EMP-Industria","tipus":"Abocador","def":"Indret destinat a abocar-hi escombraries, runa, etc"},{"familia":"EMP-Industria","tipus":"Deixalleria","def":"Indret especialment equipat per a rebre i emmagatzemar les deixalles que no són objecte de recollida domiciliària."},{"familia":"EMP-Industria","tipus":"Empr. d'automoció","def":"Sector de la indústria relatiu a l'automòbil i als seus components."},{"familia":"EMP-Industria","tipus":"Empr. de la construcció","def":"Comprèn un gran nombre d'activitats diverses, que van des de la fabricació dels materials de construcció, el més important dels quals és el ciment, fins al bastiment de cases, fàbriques i grans obres públiques."},{"familia":"EMP-Industria","tipus":"Empr. de la fusta i paper","def":"Sector industrial en el qual la matèria primera seran la fusta i el paper, per la confecció de productes derivats d'aquests materials."},{"familia":"EMP-Industria","tipus":"Empr. de productes alimentació/begudes","def":"Empreses que s'encarreguen de tots els processos relacionats amb la cadena alimentària, s'inclouen les fases de transport, recepció, emmagatzemament, processament, conservació i servei d'aliments de consum humà i animal."},{"familia":"EMP-Industria","tipus":"Empr. extractives","def":"Sector industrial en el qual s'encarreguen d'extreure la matèria primera del seu ambient natural."},{"familia":"EMP-Industria","tipus":"Empr. Metal·lúrgiques","def":"Sector industrial que inclou les activitats relacionades amb el processament de metalls per a la fabricació de peces, màquines i eines que es necessiten a la indústria i als altres sectors de l'economia."},{"familia":"EMP-Industria","tipus":"Empr. químic/farmac/perfum/cosmètica","def":"Activitat principal relacionada amb producció-tractament de productes químics; farmacològics i cosmètics."},{"familia":"EMP-Industria","tipus":"Empr. tèxtil, calçat i complementaris","def":"Empreses que es basen amb el treball de matèries primeres com tela, fibres, fils i derivats d'aquests. Sector del calçat conjunt d'activitats de disseny, fabricació, distribució, comercialització i venda de tot tipus de calçat pel peu."},{"familia":"EMP-Industria","tipus":"Empresa General/Fàbrica","def":"Empresa o instal.lació industrial no inclosa a les definicions anteriors."},{"familia":"EMP-Industria","tipus":"Foneria de metalls preciosos","def":"Indret destinat on es treballen els metalls preciosos pel procediment de fosa."},{"familia":"EMP-Industria","tipus":"Gestor de residus industrials","def":"Empreses dedicades a les activitats d'eliminació, valorització o emmagatzemament dels residus."},{"familia":"EMP-Industria","tipus":"Infraestructura empresa","def":"Conjunt d’elements, especialment els materials, fonamentals per al desenvolupament de l'activitat industrial"},{"familia":"EMP-Industria","tipus":"Instal·lació estratègica","def":"Instal.lació amb una rellevància estràtegica per la seva funcionalitat. Per ex. una central nuclear."},{"familia":"EMP-Industria","tipus":"Maquinària/equips/eines empresa","def":"Màquines i accessoris necessaris per acoblar a les màquines i eines característiques per poder desenvolupar tasques al sector industrial."},{"familia":"EMP-Industria","tipus":"Parc eòlic i fotovoltaic industrial","def":"Indret terrestre o marítim, on hi ha una agrupació d'aerogeneradors i/o panells fotovoltaics que produeixen energia elèctrica destinada a la indústria i grans consumidors."},{"familia":"EMP-Serveis","tipus":"Altres empreses de serveis","def":"Són empreses que tenen com a funció oferir una activitat que les persones i/o a les empreses a canvi d'un preu. Qualsevol que no es pugui incloure en cap altre tipus de la família EMP- Serveis."},{"familia":"EMP-Serveis","tipus":"Cable aeri","def":"S'anomena a tot cablejat que es troba a l'exterior a una distància del terra i que travessa l'orografia d'un territori amb l'ajut d'estructures fixes tant de fusta com metàl·liques, per permetre la connexió a territoris distants."},{"familia":"EMP-Serveis","tipus":"Cable soterrat","def":"S'anomena a tot cablejat que es troba a l'interior d'una rasa o conducte que travessa l'orografia d'un territori, per permetre la connexió a territoris distants."},{"familia":"EMP-Serveis","tipus":"Centre transformador elèctric","def":"Instal·lació on es situen els transformadors necessaris per transformar l'energia elèctrica de mitja a baixa tensió."},{"familia":"EMP-Serveis","tipus":"Despatx de detectius","def":"Les oficines constituides per un o més detectius que presten serveis d’investigació privada."},{"familia":"EMP-Serveis","tipus":"Empresa de seguretat privada","def":"Empresa privada que presta els serveis de seguretat, així catalogats per la legislació vigent, a tercers."},{"familia":"EMP-Serveis","tipus":"Empresa de transports i emmagatzematge","def":"Empresa que la seva activitat consisteix en el moviment de persones o mercaderies, així com facilitar els serveis de recepció, entrega i manipulació d'aquestes mercaderies."},{"familia":"EMP-Serveis","tipus":"Empresa operadora de joc","def":"Es defineixen com aquelles persones físiques o jurídiques que degudament autoritzades tenen per objecte l'organització i explotació de jocs "def":"Espai marítim de domini públic sotmès a la sobirania d'un estat i determinat per la zona de mar més propera a les costes,delimitada internament per les aigües interiors i que s'estén fins a una distància acordada segons els tractats internacionals."},{"familia":"ESP-Espais oberts","tipus":"Muntanya/Bosc","def":"Una muntanya es defineix pels conceptes de desnivell i d’altitud sobre el nivell marí. El bosc és una formació vegetal on predominen els arbres, els quals determinen l’existència d’un ambient forestal."},{"familia":"ESP-Espais oberts","tipus":"Parc Natural","def":"Espai natural protegit que consisteix generalment en un territori d’una certa extensió i poc o molt habitat i explotat que presenta valors naturals de particular interès científic, educatiu i recreatiu."},{"familia":"ESP-Espais oberts","tipus":"Platja","def":"Espai de costa de poca inclinació, format per acumulació de sorra."},{"familia":"ESP-Via pública","tipus":"Cabina telefònica","def":"Caseta o compartiment a l’interior del qual hi ha un telèfon públic, situat a la via pública o dins d'un edifici."},{"familia":"ESP-Via pública","tipus":"Contenidors","def":"Recipient de capacitat i formes diverses, obert o tancat, destinat a l'emmagatzematge d'escombraries de tota mena."},{"familia":"ESP-Via pública","tipus":"Edifici/infraestructura en desús","def":"Immoble o infraestructura que no desenvolupa cap activitat i es troba abandonat."},{"familia":"ESP-Via pública","tipus":"Mercat/Fira a la via pública","def":"Espai on es realitza un intercanvi comercial de mercaderies, amb o sense periodicitat. Ex: mercat setmanal al carrer, fira d'artesania a la via pública,..."},{"familia":"ESP-Via pública","tipus":"Mobiliari urbà","def":"Equipament de propietat o gestió municipal (fanal, paperera, banc, etc.) que formin part del paisatge urbà i siguin d'ús públic."},{"familia":"ESP-Via pública","tipus":"Obra en construcció","def":"Edifici o construcció en general en procés d'execució."},{"familia":"ESP-Via pública","tipus":"Parcs/Jardins","def":"Espai de terreny obert, delimitat i poblat de plantes, boscs, prats i estanys destinat principalment a l’esbarjo humà"},{"familia":"ESP-Via pública","tipus":"Pàrquing públic","def":"Zona pública oberta destinada a aparcar-hi vehicles, per exemple: zona blava/verda."},{"familia":"ESP-Via pública","tipus":"Passeig marítim","def":"Carrer, avinguda o via d'una certa amplada, originalment destinat a passejar-hi, enfront del mar."},{"familia":"ESP-Via pública","tipus":"Urbanització","def":"Terreny delimitat, establert de nou segons un pla de conjunt (traçat de carrers, clavegueram, xarxa elèctrica, etc.) per a poder edificar-hi un nucli de població."},{"familia":"ESP-Via pública","tipus":"Via Pública","def":"Espai públic on transiten els vianants. En el cas de vehicles el lloc on es troba són els relacionats a la familia MOB-Xarxa viària."},{"familia":"ESP-Via pública","tipus":"Zona d'oci/lúdica","def":"Espai on es concentren diversos establiments de pública concurrència, com discoteques, bars, bars- musicals, etc."},{"familia":"ESP-Via pública","tipus":"Zona portuària lúdica/comercial","def":"Espai ubicat en el port d'una localitat on es concentren establiments de pública concurrència i establiments comercials."},{"familia":"ESP-Via pública","tipus":"Zona/Eix comercial","def":"Espai on es concentren establiments comercials i ha obtingut un grau d’especialització comercial adequada, sovint dotat també de serveis, cinemes, restauració."},{"familia":"ESP-Via pública","tipus":"Zona/Polígon industrial","def":"Espai dotat de les infraestructures i dels equipaments necessaris per a la instal·lació d'indústries."},{"familia":"EST-Comerç General (Centre Comercial)","tipus":"Agència de viatges_CC","def":"Establiment sota qualsevol forma empresarial, que comercialitza i organitza viatges combinats i que té reservades en exclusiva aquestes activitats. Ubicat en un centre comercial."},{"familia":"EST-Comerç General (Centre Comercial)","tipus":"A n un centre comercial."},{"familia":"EST-Comerç General (Centre Comercial)","tipus":"Locutori_CC","def":"Establiment comercial que ofereix als usuaris el servei de comunicacions telefòniques i/o connexions a internet. Ubicat en un centre comercial."},{"familia":"EST-Comerç General (Centre Comercial)","tipus":"Òptica_CC","def":"Establiment on es venen al detall instruments òptics i d'audició. Ubicat en un centre comercial."},{"familia":"EST-Comerç General (Centre Comercial)","tipus":"Parafarmàcia_CC","def":"Establiment on es venen productes cosmètics, dietètics i similars, i també fàrmacs que no requereixen recepta. Ubicat en un centre comercial."},{"familia":"EST-Comerç General (Centre Comercial)","tipus":"Pàrquing Centre Comercial","def":"Zona dins de l'establiment comercial destinat a l'estacionament de vehicles. Ubicat en un centre comercial."},{"familia":"EST-Comerç General (Centre Comercial)","tipus":"Perfumeria_CC","def":"Establiment on es venen al detall perfums i/o objectes de bellesa. Ubicat en un centre comercial."},{"familia":"EST-Comerç General (Centre Comercial)","tipus":"Perruqueria/Centre d'estètica_CC","def":"Establiment especialitzat en la cura i l’agençament dels cabells/ Establiment especialitzat en embellir el cos i, particularment, la pell. Ubicat en un centre comercial."},{"familia":"EST-Comerç General (Centre Comercial)","tipus":"Quiosc_CC","def":"Pavelló, generalment obert de tots costats, destinat a la venda de periòdics, revistes, flors, begudes, etc. Ubicat en un centre comercial."},{"familia":"EST-Alimentació (Centre Comercial)","tipus":"Botiga d'alimentació/Begudes_CC","def":"Establiment d’autoservei amb oferta de productes de consum, sobretot d’alimentació."},{"familia":"EST-Alimentació (Centre Comercial)","tipus":"Forn de pa/Pastisseria_CC","def":"Establiment on es realitza l’activitat de venda de pa i/o productes de pastisseria, amb o sense obrador annex, on es realitza l’elaboració de massa de pa i/o productes de pastisseria."},{"fam s, com ara tabac, llumins, timbres de correu, paper de pagaments a l'Estat, etc"},{"familia":"EST-Comerç General","tipus":"Llibreria/Papereria_COM","def":"Establiment on es venen llibres i/o paper, però també objectes i estris per escriure, dibuixar, etc ."},{"familia":"EST-Comerç General","tipus":"Locutori_COM","def":"Establiment comercial que ofereix als usuaris el servei de comunicacions telefòniques i/o connexions a internet."},{"familia":"EST-Comerç General","tipus":"Mercat municipal (zona comuna)","def":"Zona dins d'una instalació municipal, fora de les diverses parades, destinada al pas dels usuaris i empleats, incloent els serveis i les zones de descans que ofereix el mercat."},{"familia":"EST-Comerç General","tipus":"Òptica_COM","def":"Establiment on es venen al detall instruments òptics i d'audició."},{"familia":"EST-Comerç General","tipus":"Parafarmàcia_COM","def":"Establiment on es venen productes cosmètics, dietètics i similars, i també fàrmacs que no requereixen recepta."},{"familia":"EST-Comerç General","tipus":"Pàrquing privat de pagament","def":"Zona o establiment destinat a aparcar-hi vehicles. No és públic, ni zona blava/verda."},{"familia":"EST-Comerç General","tipus":"Perfumeria_COM","def":"Establiment on es venen al detall perfums i/o objectes de bellesa."},{"familia":"EST-Comerç General","tipus":"Perruqueria/Centre d'estètica_COM","def":"Establiment especialitzat en la cura i l’agençament dels cabells/Establiment especialitzat en embellir el cos i, particularment, la pell."},{"familia":"EST-Comerç General","tipus":"Quiosc_COM","def":"Pavelló, generalment obert de tots costats, destinat a la venda de periòdics, revistes, flors, begudes, etc."},{"familia":"EST-Comerç General","tipus":"Recinte firal","def":"Espai tancat, de titularitat pública o privada on es realitzen les fires de mostres."},{"familia":"EST-Comerç General","tipus":"Sala d'exhibició ocasional","def":"Espai on persones o entitats, exhibeixen de manera pública o privada, objectes de joieria o argenteria, així com antiguitats o obres d'art, no dedicat habitualment a aquestes activitats."},{"familia":"EST-Comerç General","tipus":"Sala subhasta ocasional","def":"Espai on persones o entitats, subasten de manera pública o privada, objectes de joieria o argenteria, així com antiguitats o obres d'art, no dedicat habitualment a aquestes activitats."},{"familia":"EST-Hostalatge","tipus":"Alberg/Refugi","def":"Casa on es dóna allotjament o edifici construït a la muntanya per tal que els excursionistes puguin fer-hi nit o aixoplugar-s'hi."},{"familia":"EST-Hostalatge","tipus":"Aparthotel","def":"Modalitat d'hotel que es caracteritza per disposar de les instal·lacions adequades per la conservació, elaboració i consum d'aliments dins de cada habitació/unitat d'allotjament."},{"familia":"EST-Hostalatge","tipus":"Càmping","def":"Equipament turístic que consisteix en una extensió de terreny dotada de les instal·lacions necessàries per al servei dels acampadors."},{"familia":"EST-Hostalatge","tipus":"Casa de colònies","def":"Instal·lació que, permanentment o temporalment, es destina a donar allotjament a grups d'infants o de joves que participen en activitats educatives en el temps lliure, culturals i de lleure."},{"familia":"EST-Hostalatge","tipus":"Casa turisme rural","def":"Establiment d'allotjament turístic en el medi rural, que disposa d'una superfície de terreny vinculada a l'activitat turística."},{"familia":"EST-Hostalatge","tipus":"Complex hoteler o anàleg","def":"Superficíe on s'agrupen un conjunt d'hotels."},{"familia":"EST-Hostalatge","tipus":"Est. de lloguer d'apartaments","def":"Establiment dedicat principalment a llogar apartaments a canvi d’un preu convingut i per un temps determinat."},{"familia":"EST-Hostalatge","tipus":"Habitatge ús turístic","def":"Habitatge l'ús del qual els propietaris, amb la llicència municipal corresponent i cèdula d'habitabilitat, cedeixen a tercers en condicions d'immediata disponibilitat i moblat per a una estada de temporada inferior a tres mesos, en règim de lloguer o sota qualsevol altra forma que impliqui contraprestació econòmica."},{"familia":"EST-Hostalatge","tipus":"Hotel","def":"Establiment públic on, a canvi d'un preu fixat, es dóna allotjament i/o menjar a persones que són de pas."},{"familia":"EST-Hostalatge","tipus":"Pensió/Hostal/Fonda","def":"Establiment públic de menor categoria que un hotel, o de caràcter familiar, on es dóna allotjament i/o menjar per un període de temps a canvi d'un preu fixat."},{"familia":"EST-Joc (Centre Comercial)","tipus":"Saló de joc_CC","def":"Establiment que disposa de màquines recreatives de tipus B."},{"familia":"EST-Joc (Centre Comercial)","tipus":"Saló recreatiu_CC","def":"Local que disposa de màquines o aparells en els quals, a canvi del pagament d'un preu, es pot gaudir d'un temps de joc i eventualment es pot oferir com a únic premi la repetició d'un temps de joc."},{"familia":"EST-Joc (Comerç)","tipus":"Bingo","def":"Establiment de joc on es practica el joc del bingo."},{"familia":"EST-Joc (Comerç)","tipus":"Casino","def":"Establiment de caràcter recreatiu autoritzat oficialment per a la pràctica de jocs d'atzar."},{"familia":"EST-Joc (Comerç)","tipus":"Saló de joc_COM","def":"Establiment que disposa de màquines recreatives de tipus B."},{"familia":"EST-Joc (Comerç)","tipus":"saló recreatiu_COM","def":"Local que disposa de màquines o aparells en els quals, a canvi del pagament d'un preu, es pot gaudir d'un temps de joc i eventualment es pot oferir com a únic premi la repetició d'un temps de joc."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Bar musical_CC","def":"Establiment que es realitza en un local que ofereix servei de bar, amb ambientació musical, reproduïda o produïda en directe, sense pista de ball. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Bar_CC","def":"Establiment que disposa de barra i/o amb servei de taula, on es serveix, begudes acompanyades o no de menjar Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Cafè teatre/Cafè concert_CC","def":"Establiment que té com a objecte únic oferir en directe actuacions musicals, teatrals o de varietats, sense pista de ball o espai assimilable. Ha de disposar de servei de bar, escenari, camerinos i taules i cadires per al públic espectador. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Cinema_CC","def":"Local on es projecten pel·lícules cinematogràfiques. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Discoteca de joventut_CC","def":"Discoteca destinada al públic comprès entre els 14 i els 17 anys, amb horari especial. Aquesta activitat està condicionada a la prohibició expressa de venda, consum i exposició de begudes alcohòliques i tabac, i resta prohibida l'entrada als majors de 18 anys durant el seu desenvolupament. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Discoteca_CC","def":"Establiment amb un lloc idoni per ballar mitjançant ambientació musical i que disposa d'una o més pistes per ballar i servei de bar. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Establiment de règim especial_CC","def":"Establiment d'activitats musicals que estan subjectes a un horari especial, que es caracteritzen pel fet de poder romandre oberts al llarg del dia, tenint en compte les dues hores de tancament obligatori de cada 24 hores, per tal de realitzar les tasques de neteja i ventilació. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Karaoke_CC","def":"Establiment que té per objecte oferir al públic la possibilitat d'interpretar cançons en directe mitjançant un equip de música apropiat. Es pot realitzar tant en locals d'activitats recreatives musicals com de restauració, sempre que no superi en nombre de decibels previstos en la normativa de contaminació acústica.Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Menjar Ràpid_CC","def":"Establiment on preparen i serveixen menjar ràpidament, per consumir-lo al seu interior o bé per a emportar. Generalment es consumeix sense coberts i els locals no solen disposar de cambrers ni servei de taula. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Restaurant musical_CC","def":"Establiment que es realitza en un local que ofereix servei de bar, amb ambientació musical, reproduïda o produïda en directe. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Restaurant_CC","def":"Establiment de restauració que disposa de cuina i servei de menjador per tal d'oferir, a canvi d'un preu, menjars i begudes, que se serveixen en el mateix local.Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Restaurant-bar_CC","def":"Establiment de restauració que ofereix, a canvi d'un preu, els serveis propis d'un bar i/o d'un restaurant. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Sala de ball_CC","def":"Local que ofereix al públic un lloc idoni per ballar amb música en directe i complementàriament amb música gravada prèviament i transmesa per mitjans mecànics. Ha de disposar d'escenari per a l'orquestra, pista de ball, camerinos per als artistes i servei de bar. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Sala de festes d'infància i joventut_CC","def":"Sala de festes amb espectacle o sala de concerts destinades al públic menor d'edat, el qual fins als 14 anys ha d'anar acompanyat d'una persona major d'edat. Aquestes activitats estan condicionades a la prohibició expressa de venda, consum i exposició de begudes alcohòliques i tabac als menors. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Sales de festa amb espectacle_CC","def":"Local que ofereix actuacions musicals o de varietats o música per ballar. Ha de disposar d'escenari amb pista de ball o sense, camerinos per als artistes i servei de bar i/o restaurant. Ubicat en un centre comercial."},{"familia":"EST-Oci (Comerç)","tipus":"Bar musical_COM","def":"Establiment que es realitza en un local que ofereix servei de bar, amb ambientació musical, reproduïda o produïda en directe, sense pista de ball."},{"familia":"EST-Oci (Comerç)","tipus":"Bar_COM","def":"Establiment que disposa de barra i/o amb servei de taula, on es serveix, begudes acompanyades o no de menjar"},{"familia":"EST-Oci (Comerç)","tipus":"Cafè teatre/Cafè concert_COM","def":"Establiment que té com a objecte únic oferir en directe actuacions musicals, teatrals o de varietats, sense pista de ball o espai assimilable. Ha de disposar de servei de bar, escenari, camerinos i taules i cadires per al públic espectador."},{"familia":"EST-Oci (Comerç)","tipus":"Cinema_COM","def":"Local on es projecten pel·lícules cinematogràfiques."},{"familia":"EST-Oci (Comerç)","tipus":"Circ","def":"Espectacle en el qual s'ofereix la representació d'actuacions i habilitats de diferents tipus, de caràcter físic, màgic, humorístic o d'audàcia, amb o sense elements mecànics tals com trapezi, cables o altres. En aquests espectacles poden intervenir animals d'acord amb el que disposa la normativa específica sobre protecció d'animals."},{"familia":"EST-Oci (Comerç)","tipus":"Discoteca de joventut_COM","def":"Discoteca destinada al públic comprès entre els 14 i els 17 anys, amb horari especial. Aquesta activitat està condicionada a la prohibició expressa de venda, consum i exposició de begudes alcohòliques i tabac, i resta prohibida l'entrada als majors de 18 anys durant el seu desenvolupament."},{"familia":"EST-Oci (Comerç)","tipus":"Discoteca_COM","def":"Establiment amb un lloc idoni per ballar mitjançant ambientació musical i que disposa d'una o més pistes per ballar i servei de bar."},{"familia":"EST-Oci (Comerç)","tipus":"Espectacle a la via pública","def":"Espais oberts al públic habilitats per a la realització o execució d'activitats recreatives, i que no disposen d'infraestructures ni de instal·lacions fixes per fer-ho. En els espais oberts al públic s'ha de delimitar la zona dels espectadors i espectadores respecte de la dels actuants."},{"familia":"EST-Oci (Comerç)","tipus":"Establiment de règim especial_COM","def":"Establiment d'activitats musicals que estan subjectes a un horari especial, que es caracteritzen pel fet de poder romandre oberts al llarg del dia, tenint en compte les dues hores de tancament obligatori de cada 24 hores, per tal de realitzar les tasques de neteja i ventilació."},{"familia":"EST-Oci (Comerç)","tipus":"Fira d'atraccions","def":"Recinte amb un conjunt d'atracions tradicionals, de caràcter temporal i petita grandària."},{"familia":"EST-Oci (Comerç)","tipus":"Karaoke_COM","def":"Establiment que té per objecte oferir al públic la possibilitat d'interpretar cançons en directe mitjançant un equip de música apropiat. Es pot realitzar tant en locals d'activitats recreatives musicals com de restauració, sempre que no superi en nombre de decibels previstos en la normativa de contaminació acústica."},{"familia":"EST-Oci (Comerç)","tipus":"Menjar Ràpid_COM","def":"Establiment on preparen i serveixen menjar ràpidament, per consumir-lo al seu interior o bé per a emportar. Generalment es consumeix sense coberts i els locals no solen disposar de cambrers ni servei de taula."},{"familia":"EST-Oci (Comerç)","tipus":"Parc temàtic/atraccions/aquàtic","def":"Recinte amb un conjunt d'atraccions, espais per a l'oci, entreteniment, educació i cultura, normalment organitzades entorn d'una línia argumental que els serveix d'inspiració."},{"familia":"EST-Oci (Comerç)","tipus":"Prostíbul","def":"Qualsevol lloc tancat, ja sigui un local, un habitatge, o altres on s'efectuïn serveis de naturalesa sexual."},{"familia":"EST-Oci (Comerç)","tipus":"Restaurant musical_COM","def":"Establiment que ofereix servei de restaurant amb ambientació musical "},{"familia":"EMP-Industria","tipus":"Empr. de productes alimentació/begudes","def":"Empreses que s'encarreguen de tots els processos relacionats amb la cadena alimentària, s'inclouen les fases de transport, recepció, emmagatzemament, processament, conservació i servei d'aliments de consum humà i animal."},{"familia":"EMP-Industria","tipus":"Empr. extractives","def":"Sector industrial en el qual s'encarreguen d'extreure la matèria primera del seu ambient natural."},{"familia":"EMP-Industria","tipus":"Empr. Metal·lúrgiques","def":"Sector industrial que inclou les activitats relacionades amb el processament de metalls per a la fabricació de peces, màquines i eines que es necessiten a la indústria i als altres sectors de l'economia."},{"familia":"EMP-Industria","tipus":"Empr. químic/farmac/perfum/cosmètica","def":"Activitat principal relacionada amb producció-tractament de productes químics; farmacològics i cosmètics."},{"familia":"EMP-Industria","tipus":"Empr. tèxtil, calçat i complementaris","def":"Empreses que es basen amb el treball de matèries primeres com tela, fibres, fils i derivats d'aquests. Sector del calçat conjunt d'activitats de disseny, fabricació, distribució, comercialització i venda de tot tipus de calçat pel peu."},{"familia":"EMP-Industria","tipus":"Empresa General/Fàbrica","def":"Empresa o instal.lació industrial no inclosa a les definicions anteriors."},{"familia":"EMP-Industria","tipus":"Foneria de metalls preciosos","def":"Indret destinat on es treballen els metalls preciosos pel procediment de fosa."},{"familia":"EMP-Industria","tipus":"Gestor de residus industrials","def":"Empreses dedicades a les activitats d'eliminació, valorització o emmagatzemament dels residus."},{"familia":"EMP-Industria","tipus":"Infraestructura empresa","def":"Conjunt d’elements, especialment els materials, fonamentals per al desenvolupament de l'activitat industrial"},{"familia":"EMP-Industria","tipus":"Instal·lació estratègica","def":"Instal.lació amb una rellevància estràtegica per la seva funcionalitat. Per ex. una central nuclear."},{"familia":"EMP-Industria","tipus":"Maquinària/equips/eines empresa","def":"Màquines i accessoris necessaris per acoblar a les màquines i eines característiques per poder desenvolupar tasques al sector industrial."},{"familia":"EMP-Industria","tipus":"Parc eòlic i fotovoltaic industrial","def":"Indret terrestre o marítim, on hi ha una agrupació d'aerogeneradors i/o panells fotovoltaics que produeixen energia elèctrica destinada a la indústria i grans consumidors."}],"EMP-Serveis":[{"familia":"EMP-Serveis","tipus":"Altres empreses de serveis","def":"Són empreses que tenen com a funció oferir una activitat que les persones i/o a les empreses a canvi d'un preu. Qualsevol que no es pugui incloure en cap altre tipus de la família EMP- Serveis."},{"familia":"EMP-Serveis","tipus":"Cable aeri","def":"S'anomena a tot cablejat que es troba a l'exterior a una distància del terra i que travessa l'orografia d'un territori amb l'ajut d'estructures fixes tant de fusta com metàl·liques, per permetre la connexió a territoris distants."},{"familia":"EMP-Serveis","tipus":"Cable soterrat","def":"S'anomena a tot cablejat que es troba a l'interior d'una rasa o conducte que travessa l'orografia d'un territori, per permetre la connexió a territoris distants."},{"familia":"EMP-Serveis","tipus":"Centre transformador elèctric","def":"Instal·lació on es situen els transformadors necessaris per transformar l'energia elèctrica de mitja a baixa tensió."},{"familia":"EMP-Serveis","tipus":"Despatx de detectius","def":"Les oficines constituides per un o més detectius que presten serveis d’investigació privada."},{"familia":"EMP-Serveis","tipus":"Empresa de seguretat privada","def":"Empresa privada que presta els serveis de seguretat, així catalogats per la legislació vigent, a tercers."},{"familia":"EMP-Serveis","tipus":"Empresa de transports i emmagatzematge","def":"Empresa que la seva activitat consisteix en el moviment de persones o mercaderies, així com facilitar els serveis de recepció, entrega i manipulació d'aquestes mercaderies."},{"familia":"EMP-Serveis","tipus":"Empresa operadora de joc","def":"Es defineixen com aquelles persones físiques o jurídiques que degudament autoritzades tenen per objecte l'organització i explotació de jocs mitjançant la utilització de màquines recreatives i d'atzar."},{"familia":"EMP-Serveis","tipus":"Empresa treball temporal","def":"Empresa que la seva activitat consisteix a posar a disposició d'una altra empresa, amb caràcter temporal, treballadors per ella contractats."},{"familia":"EMP-Serveis","tipus":"Línies/equipaments comunicació elèctrics","def":"Equipaments o línies conductores emprats per al transport i la distribució de l'energia elèctrica."},{"familia":"EMP-Serveis","tipus":"Oficines/Despatxos professionals","def":"Lloc on legalment es considera establerta una entitat per al compliment de les seves obligacions i per a l'exercici dels seus drets."},{"familia":"EMP-Serveis","tipus":"Repetidors TV/Ràdio/Telefonia","def":"Aparell que rep un senyal elèctric o electromagnètic, l'amplifica i el retransmet."},{"familia":"EMP-Serveis","tipus":"Subministraments d'energia i combustible","def":"Són empreses que es dediquen a proveir segons les necessitats dels usuaris, tant energia com combustible."},{"familia":"EMP-Serveis","tipus":"Transport de paqueteria","def":"Empreses dedicades al transport urgent, nacional i/o internacional, de paqueteria i/o documentació."}],"ESP-Espais oberts":[{"familia":"ESP-Espais oberts","tipus":"Aigües interiors","def":"Espais marítims i masses líquides d'aigua dolça situats a l'interior de la línia de base de la mar territorial, incloent-hi els rius i llacs."},{"familia":"ESP-Espais oberts","tipus":"Altres espais oberts","def":"Qualsevol que no es pugui incloure en cap altre tipus de la família d'espais oberts."},{"familia":"ESP-Espais oberts","tipus":"Descampat Urbà","def":"Solar desocupat sense construir, sense conreu n que disposa de màquines o aparells en els quals, a canvi del pagament d'un preu, es pot gaudir d'un temps de joc i eventualment es pot oferir com a únic premi la repetició d'un temps de joc."}],"EST-Oci (Centre Comercial)":[{"familia":"EST-Oci (Centre Comercial)","tipus":"Bar musical_CC","def":"Establiment que es realitza en un local que ofereix servei de bar, amb ambientació musical, reproduïda o produïda en directe, sense pista de ball. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Bar_CC","def":"Establiment que disposa de barra i/o amb servei de taula, on es serveix, begudes acompanyades o no de menjar Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Cafè teatre/Cafè concert_CC","def":"Establiment que té com a objecte únic oferir en directe actuacions musicals, teatrals o de varietats, sense pista de ball o espai assimilable. Ha de disposar de servei de bar, escenari, camerinos i taules i cadires per al públic espectador. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Cinema_CC","def":"Local on es projecten pel·lícules cinematogràfiques. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Discoteca de joventut_CC","def":"Discoteca destinada al públic comprès entre els 14 i els 17 anys, amb horari especial. Aquesta activitat està condicionada a la prohibició expressa de venda, consum i exposició de begudes alcohòliques i tabac, i resta prohibida l'entrada als majors de 18 anys durant el seu desenvolupament. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Discoteca_CC","def":"Establiment amb un lloc idoni per ballar mitjançant ambientació musical i que disposa d'una o més pistes per ballar i servei de bar. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Establiment de règim especial_CC","def":"Establiment d'activitats musicals que estan subjectes a un horari especial, que es caracteritzen pel fet de poder romandre oberts al llarg del dia, tenint en compte les dues hores de tancament obligatori de cada 24 hores, per tal de realitzar les tasques de neteja i ventilació. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Karaoke_CC","def":"Establiment que té per objecte oferir al públic la possibilitat d'interpretar cançons en directe mitjançant un equip de música apropiat. Es pot realitzar tant en locals d'activitats recreatives musicals com de restauració, sempre que no superi en nombre de decibels previstos en la normativa de contaminació acústica.Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Menjar Ràpid_CC","def":"Establiment on preparen i serveixen menjar ràpidament, per consumir-lo al seu interior o bé per a emportar. Generalment es consumeix sense coberts i els locals no solen disposar de cambrers ni servei de taula. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Restaurant musical_CC","def":"Establiment que es realitza en un local que ofereix servei de bar, amb ambientació musical, reproduïda o produïda en directe. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Restaurant_CC","def":"Establiment de restauració que disposa de cuina i servei de menjador per tal d'oferir, a canvi d'un preu, menjars i begudes, que se serveixen en el mateix local.Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Restaurant-bar_CC","def":"Establiment de restauració que ofereix, a canvi d'un preu, els serveis propis d'un bar i/o d'un restaurant. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Sala de ball_CC","def":"Local que ofereix al públic un lloc idoni per ballar amb música en directe i complementàriament amb música gravada prèviament i transmesa per mitjans mecànics. Ha de disposar d'escenari per a l'orquestra, pista de ball, camerinos per als artistes i servei de bar. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Sala de festes d'infància i joventut_CC","def":"Sala de festes amb espectacle o sala de concerts destinades al públic menor d'edat, el qual fins als 14 anys ha d'anar acompanyat d'una persona major d'edat. Aquestes activitats estan condicionades a la prohibició expressa de venda, consum i exposició de begudes alcohòliques i tabac als menors. Ubicat en un centre comercial."},{"familia":"EST-Oci (Centre Comercial)","tipus":"Sales de festa amb espectacle_CC","def":"Local que ofereix actuacions musicals o de varietats o música per ballar. Ha de disposar d'escenari amb pista de ball o sense, camerinos per als artistes i servei de bar i/o restaurant. Ubicat en un centre comercial."}],"EST-Oci (Comerç)":[{"familia":"EST-Oci (Comerç)","tipus":"Bar musical_COM","def":"Establiment que es realitza en un local que ofereix servei de bar, amb ambientació musical, reproduïda o produïda en directe, sense pista de ball."},{"familia":"EST-Oci (Comerç)","tipus":"Bar_COM","def":"Establiment que disposa de barra i/o amb servei de taula, on es serveix, begudes acompanyades o no de menjar"},{"familia":"EST-Oci (Comerç)","tipus":"Cafè teatre/Cafè concert_COM","def":"Establiment que té com a objecte únic oferir en directe actuacions musicals, teatrals o de varietats, sense pista de ball o espai assimilable. Ha de disposar de servei de bar, escenari, camerinos i taules i cadires per al públic espectador."},{"familia":"EST-Oci (Comerç)","tipus":"Cinema_COM","def":"Local on es projecten pel·lícules cinematogràfiques."},{"familia":"EST-Oci (Comerç)","tipus":"Circ","def":"Espectacle en el qual s'ofereix la representació d'actuacions i habilitats de diferents tipus, de caràcter físic, màgic, humorístic o d'audàcia, amb o sense elements mecànics tals com trapezi, cables o altres. En aquests espectacles poden intervenir animals d'acord amb el que disposa la normativa específica sobre protecció d'animals."},{"familia":"EST-Oci (Comerç)","tipus":"Discoteca de joventut_COM","def":"Discoteca destinada al públic comprès entre els 14 i els 17 anys, amb horari especial. Aquesta activitat està condicionada a la prohibició expressa de venda, consum i exposició de begudes alcohòliques i tabac, i resta prohibida l'entrada als majors de 18 anys durant el seu desenvolupament."},{"familia":"EST-Oci (Comerç)","tipus":"Discoteca_COM","def":"Establiment amb un lloc idoni per ballar mitjançant ambientació musical i que disposa d'una o més pistes per ballar i servei de bar."},{"familia":"EST-Oci (Comerç)","tipus":"Espectacle a la via pública","def":"Espais oberts al públic habilitats per a la realització o execució d'activitats recreatives, i que no disposen d'infraestructures ni de instal·lacions fixes per fer-ho. En els espais oberts al públic s'ha de delimitar la zona dels espectadors i espectadores respecte de la dels actuants."},{"familia":"EST-Oci (Comerç)","tipus":"Establiment de règim especial_COM","def":"Establiment d'activitats musicals que estan subjectes a un horari especial, que es caracteritzen pel fet de poder romandre oberts al llarg del dia, tenint en compte les dues hores de tancament obligatori de cada 24 hores, per tal de realitzar les tasques de neteja i ventilació."},{"familia":"EST-Oci (Comerç)","tipus":"Fira d'atraccions","def":"Recinte amb un conjunt d'atracions tradicionals, de caràcter temporal i petita grandària."},{"familia":"EST-Oci (Comerç)","tipus":"Karaoke_COM","def":"Establiment que té per objecte oferir al públic la possibilitat d'interpretar cançons en directe mitjançant un equip de música apropiat. Es pot realitzar tant en locals d'activitats recreatives musicals com de restauració, sempre que no superi en nombre de decibels previstos en la normativa de contaminació acústica."},{"familia":"EST-Oci (Comerç)","tipus":"Menjar Ràpid_COM","def":"Establiment on preparen i serveixen menjar ràpidament, per consumir-lo al seu interior o bé per a emportar. Generalment es consumeix sense coberts i els locals no solen disposar de cambrers ni servei de taula."},{"familia":"EST-Oci (Comerç)","tipus":"Parc temàtic/atraccions/aquàtic","def":"Recinte amb un conjunt d'atraccions, espais per a l'oci, entreteniment, educació i cultura, normalment organitzades entorn d'una línia argumental que els serveix d'inspiració."},{"familia":"EST-Oci (Comerç)","tipus":"Prostíbul","def":"Qualsevol lloc tancat, ja sigui un local, un habitatge, o altres on s'efectuïn serveis de naturalesa sexual."},{"familia":"EST-Oci (Comerç)","tipus":"Restaurant musical_COM","def":"Establiment que ofereix servei de restaurant amb ambientació musical, reproduïda o produïda en directe."},{"familia":"EST-Oci (Comerç)","tipus":"Restaurant_COM","def":"Establiment de restauració que disposa de cuina i servei de menjador per tal d'oferir, a canvi d'un preu, menjars i begudes, que se serveixen en el mateix local."},{"familia":"EST-Oci (Comerç)","tipus":"Restaurant-Bar_COM","def":"Establiment de restauració que ofereix, a canvi d'un preu, els serveis propis d'un bar i/o d'un restaurant."},{"familia":"EST-Oci (Comerç)","tipus":"Sala de ball_COM","def":"Establiment amb un lloc idoni per ballar amb música en directe i complementàriament amb ambientació musical. Ha de disposar d'un escenari, una o més pistes, vestidors pels actuants i servei de bar."},{"familia":"EST-Oci (Comerç)","tipus":"Sala de concert","def":"Local, que pot disposar de servei de bar i que té per objecte oferir al públic actuacions de música en directe, i altres activitats culturals. La sala de concerts ha de disposar d'un escenari o espai habilitat i destinat a l'oferiment de concerts i d'equipament tècnic adequat per a la realització d'aquests, i pot disposar també de vestidor per als actuants."},{"familia":"EST-Oci (Comerç)","tipus":"Sala de festes d'infància i joventut_COM","def":"Sala de festes amb espectacle o sala de concerts destinades al públic menor d'edat, el qual fins als 1 us":"Hab. 2a Res. Casa adossada","def":"Casa unida a una altra d'idèntica o semblant per la paret dorsal que, de manera estacional, periòdica o esporàdica, ocupen persones que resideixen habitualment en un altre indret."},{"familia":"HAB_Domicili","tipus":"Hab. 2a Res. Casa aïllada/4vents","def":"Casa separada d'altres cases, habitualment envoltada per un terreny pertanyent a l'habitatge, que de manera estacional, periòdica o esporàdica, ocupen persones que resideixen habitualment en un altre indret."},{"familia":"HAB_Domicili","tipus":"Hab. 2a Res. Masia/casa de camp","def":"Casa de pagès/casa de camp/mas que forma part d'una explotació agrícola, ramadera o forestal, que de manera estacional, periòdica o esporàdica, ocupen persones que resideixen habitualment en un altre indret."},{"familia":"HAB_Domicili","tipus":"Hab. 2a Res. Pis/apartament","def":"Habitatge independent i amb entrada comuna a l'edifici que, de manera estacional, periòdica o esporàdica, ocupen persones que resideixen habitualment en un altre indret."}],"MOB-Aero (Altres llocs)":[{"familia":"MOB-Aero (Altres llocs)","tipus":"Autovia Vial_AERO","def":"Carretera de circul.lació definida en el RGC."},{"familia":"MOB-Aero (Altres llocs)","tipus":"Benzinera_AERO","def":"Establiment on es subministren, a canvi d'un preu fixat, combustibles i carburants."},{"familia":"MOB-Aero (Altres llocs)","tipus":"Camí Prat-Platja_AERO","def":"Camí que connecta el poble del Prat i l'aeroport amb la platja del Prat."},{"familia":"MOB-Aero (Altres llocs)","tipus":"Centre Control Las Palmeras_AERO","def":"Edifici d'AENA on hi ha una zona destinada a les sales de brífing, armers i vestidors de la PG-ME."},{"familia":"MOB-Aero (Altres llocs)","tipus":"Dispòsit municipal_AERO","def":"Dipòsit municipal de vehicles."},{"familia":"MOB-Aero (Altres llocs)","tipus":"Parc Natural_AERO","def":"Parc protegit d'interès natural de fauna i flora."}],"MOB-Aero (Parc Serveis Aeronàutics)":[{"familia":"MOB-Aero (Parc Serveis Aeronàutics) expressament per acollir instal·lacions i serveis destinats a cobrir les necessitats de la circulació. Poden acollir, estacions de serveis, restaurants, tallers de reparació de vehicle o qualsevol altre servei destinat a facilitar la seguretat i comoditat dels usuaris de les vies."},{"familia":"MOB-Xarxa viària","tipus":"Autopista Vial","def":"Són carreteres construïdes i senyalitzades com a tals per l’exclussiva circulació d’automòbils sempre que reuneixin les característiques següents: Que les propietats colindants no tinguin accés a la mateixa i que no es creui a nivell cap altre via. Les autopistes han de constar de diferents calçades per cada sentit de la circulació, separades entre sí per una franja de terreny que no es pot destinar a la circulació de vehicles (tret de punts singulars, que són els passos de via)."},{"familia":"MOB-Xarxa viària","tipus":"Autovia Àrea de descans","def":"Lloc habilitat per l'estacionament de vehicles a les carreteres, especialment a les autovies on els conductors poden descansar en el seu viatge i que no està dotat de benzineres, restaurants o altres serveis."},{"familia":"MOB-Xarxa viària","tipus":"Autovia Àrea de servei","def":"Són zones colindants a les carreteres, dissenyades expressament per acollir instal·lacions i serveis destinats a cobrir les necessitats de la circulació. Poden acollir, estacions de serveis, restaurants, tallers de reparació de vehicle o qualsevol altre servei destinat a facilitar la seguretat i comoditat dels usuaris de les vies."},{"familia":"MOB-Xarxa viària","tipus":"Autovia Vial","def":"Són carreteres construïdes i senyalitzades com a tals, amb les mateixes característiques que les autopistes excepte en allò relatiu als accessos ja que les autovies tenen accés limitat de les propietats colindants."},{"familia":"MOB-Xarxa viària","tipus":"Camí/Pista Forestal","def":"Vials i carreteres titularitat de les entitats locals o d’altres entitats públiques o privades construïdes pels seus propietaris com ele const fuse=new Fuse(DB,{keys:["tipus","def","familia"],threshold:0.35,includeMatches:true,minMatchCharLength:2});

const inp    = document.getElementById("search-input");
const clrBtn = document.getElementById("btn-clear");
const statEl = document.getElementById("stats-txt");
const emptyEl= document.getElementById("empty-start");
const noResEl= document.getElementById("no-results");
const listEl = document.getElementById("cards-list");
let mode = "search";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hlFuse(text,matches,key){
  if(!matches) return esc(text);
  const m=matches.find(x=>x.key===key);
  if(!m||!m.indices||!m.indices.length) return esc(text);
  let out="",last=0;
  m.indices.forEach(([s,e])=>{out+=esc(text.slice(last,s))+"<mark>"+esc(text.slice(s,e+1))+"</mark>";last=e+1;});
  return out+esc(text.slice(last));
}
function hlSimple(text,q){
  if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}

function setMode(m){
  mode=m;
  document.getElementById("btn-mode-search").classList.toggle("active",m==="search");
  document.getElementById("btn-mode-browse").classList.toggle("active",m==="browse");
  inp.placeholder=m==="search"?"Cerca: metro, hospital, bar, escola…":"Filtra famílies o tipus…";
  doSearch();
}

function quickSearch(q){inp.value=q;inp.dispatchEvent(new Event("input"));clrBtn.classList.add("vis");doSearch();}

function clearSearch(){inp.value="";clrBtn.classList.remove("vis");doSearch();}

function doSearch(){
  const q=inp.value.trim();
  clrBtn.classList.toggle("vis",q.length>0);

  if(mode==="browse"){renderBrowse(q);return;}

  // Search mode
  emptyEl.style.display="none";
  noResEl.style.display="none";
  listEl.innerHTML="";

  if(q.length<2){
    emptyEl.style.display="block";
    statEl.textContent="";
    return;
  }

  const hits=fuse.search(q);
  if(!hits.length){noResEl.style.display="block";statEl.textContent="";return;}

  statEl.textContent=hits.length+" resultat"+(hits.length===1?"":"s");
  listEl.innerHTML=`<div class="cards-flat">`+hits.map(r=>{
    const d=r.item,ms=r.matches;
    return `<div class="punt-card">
      <div class="punt-nom">${hlFuse(d.tipus,ms,"tipus")}</div>
      ${d.def?`<div class="punt-def">${hlFuse(d.def,ms,"def")}</div>`:""}
      <span class="punt-tag">${hlFuse(d.familia,ms,"familia")}</span>
    </div>`;
  }).join("")+`</div>`;
}

function renderBrowse(q){
  q=(q||"").toLowerCase();
  emptyEl.style.display="none";
  noResEl.style.display="none";

  const filtered={};
  for(const [fam,items] of Object.entries(GROUPED)){
    const match=items.filter(e=>!q||e.tipus.toLowerCase().includes(q)||(e.def&&e.def.toLowerCase().includes(q))||fam.toLowerCase().includes(q));
    if(match.length) filtered[fam]=match;
  }

  const famKeys=Object.keys(filtered);
  if(!famKeys.length){listEl.innerHTML="";noResEl.style.display="block";statEl.textContent="";return;}

  const total=Object.values(filtered).reduce((a,b)=>a+b.length,0);
  statEl.textContent=q?total+" tipus · "+famKeys.length+" famílies":"43 famílies · 427 tipus";

  listEl.innerHTML=famKeys.map(fam=>{
    const items=filtered[fam];
    const prefix=fam.includes("-")?fam.split("-")[0]:fam.slice(0,3).toUpperCase();
    const label=fam.includes("-")?fam.slice(fam.indexOf("-")+1):fam;
    const cards=items.map(e=>`<div class="punt-inner">
      <div class="punt-nom">${q?hlSimple(e.tipus,q):esc(e.tipus)}</div>
      ${e.def?`<div class="punt-def">${q?hlSimple(e.def,q):esc(e.def)}</div>`:""}
    </div>`).join("");
    return `<div class="acc-section">
      <div class="acc-hdr" onclick="this.parentElement.classList.toggle('open')">
        <span class="acc-prefix">${esc(prefix)}</span>
        <span class="acc-title">${q?hlSimple(label,q):esc(label)}</span>
        <span class="acc-count">${items.length}</span>
        <span class="acc-arr">›</span>
      </div>
      <div class="acc-body"><div class="cards-inner">${cards}</div></div>
    </div>`;
  }).join("");
}

inp.addEventListener("input",()=>doSearch());
doSearch();
</script>
