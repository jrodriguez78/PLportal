<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a3a6b">
<title>Tipologies d'Estafes · OAC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<style>
:root{
  --blue:#1a3a6b;--blue2:#2d5a9e;--blue3:#e8f0fb;
  --bg:#f0f2f5;--card:#fff;--border:#dde4f0;
  --text:#1a1a2e;--muted:#777;
  --cyber:#7c3aed;--cyber2:#ede9fe;
  --basic:#b45309;--basic2:#fef3c7;
  --tag-bg:#f1f5f9;--tag-text:#475569;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:Arial,sans-serif;color:var(--text);}
body{background:var(--bg);display:flex;flex-direction:column;}

#header{
  background:var(--blue);
  padding:10px 16px 8px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.hicon{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.htxt{flex:1;min-width:0;}
.htxt h1{color:#fff;font-size:14px;font-weight:700;line-height:1.2;}
.htxt p{color:#a8c4e8;font-size:10px;margin-top:1px;}
#btn-back{flex-shrink:0;padding:6px 12px;border:none;border-radius:6px;background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;}
#btn-back:hover{background:rgba(255,255,255,.25);}

#search-wrap{
  background:#fff;
  padding:10px 14px 8px;
  flex-shrink:0;
  border-bottom:1px solid var(--border);
}
.sbox{display:flex;gap:6px;align-items:center;}
#search-input{
  flex:1;padding:11px 14px;
  border:2px solid var(--border);border-radius:8px;
  font-size:16px;font-family:Arial,sans-serif;
  color:var(--text);background:#fff;outline:none;
  transition:border-color .15s;
}
#search-input:focus{border-color:var(--blue2);}
#search-input::placeholder{color:var(--muted);}
#btn-clear{
  padding:10px 12px;border:none;border-radius:8px;
  background:var(--bg);color:var(--muted);
  font-size:14px;cursor:pointer;flex-shrink:0;display:none;
}
#btn-search{
  padding:10px 14px;border:none;border-radius:8px;
  background:var(--blue);color:#fff;
  font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;
}
#btn-search:hover{background:var(--blue2);}

#stats-bar{
  padding:5px 14px;
  font-size:11px;color:var(--muted);
  background:#fff;border-bottom:1px solid var(--border);
  flex-shrink:0;min-height:26px;
  display:flex;align-items:center;
}

#view-results{
  flex:1;overflow-y:auto;
  padding:10px 14px 40px;
  -webkit-overflow-scrolling:touch;
}

.acc-section{margin-bottom:6px;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card);}
.acc-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  transition:background .12s;
}
.acc-header:hover{background:var(--blue3);}
.acc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.acc-title{flex:1;font-size:13px;font-weight:700;color:var(--text);}
.acc-count{flex-shrink:0;font-size:11px;color:var(--muted);font-weight:500;}
.acc-chevron{flex-shrink:0;color:var(--muted);font-size:14px;transition:transform .18s;}
.acc-section.open .acc-chevron{transform:rotate(90deg);}

.cyber .acc-dot{background:var(--cyber);}
.basic .acc-dot{background:var(--basic);}

.acc-body{display:none;padding:0 10px 10px;}
.acc-section.open .acc-body{display:block;}
.cards-grid{display:flex;flex-direction:column;gap:6px;padding-top:6px;}

.est-card{
  padding:10px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg);
}
.est-card:hover{border-color:var(--blue2);}

.est-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;}
.est-nom{font-size:12px;font-weight:700;color:var(--text);flex:1;line-height:1.3;}
.est-art{
  flex-shrink:0;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;
  white-space:nowrap;margin-top:1px;
}
.art-cyber{background:var(--cyber2);color:var(--cyber);}
.art-basic{background:var(--basic2);color:var(--basic);}

.est-desc{font-size:11px;color:var(--muted);line-height:1.45;margin-bottom:6px;}

.est-tags{display:flex;flex-wrap:wrap;gap:4px;}
.tag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--tag-bg);color:var(--tag-text);white-space:nowrap;}
.tag-leu{background:var(--basic2);color:#7a4a00;}

mark{background:rgba(232,168,0,.35);color:inherit;border-radius:2px;padding:0 1px;}
#no-results{display:none;text-align:center;padding:40px 16px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>

<div id="header">
  <div class="hicon">💳</div>
  <div class="htxt">
    <h1>Tipologies d'Estafes</h1>
    <p>Graella · Modus operandi · CP · Gener 2026</p>
  </div>
  <a id="btn-back" href="index.html">← OAC</a>
</div>

<div id="search-wrap">
  <div class="sbox">
    <input type="text" id="search-input" placeholder="Cerca tipologia… (ex: phishing, bizum, CEO, rip deal)" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="btn-clear" onclick="clearSearch()">✕</button>
    <button id="btn-search" onclick="doSearch()">Cerca</button>
  </div>
</div>

<div id="stats-bar"><span id="stats-txt"></span></div>

<div id="view-results">
  <div id="no-results">Cap tipologia trobada per aquesta cerca.</div>
  <div id="cards-list"></div>
</div>

<script>
const SECCIONS = [
  {
    id:"cyber", cls:"cyber", nom:"Estafes Ciberfacilitadores",
    tipus:[
      {nom:"Comprador online estafat",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"Per mitjà de la web o xarxa social, es fa creure que s'està comprant un bé. Habitualment es suplanta un comerç electrònic o se'n crea un específicament per defraudar."},
      {nom:"Venedor online estafat",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"Per mitjà de la web o xarxa social, es fa creure que s'està contractant un bé o servei que en realitat no existeix."},
      {nom:"Llogater online estafat",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"Es fa creure que estem llogant un immoble permanent o de temporada inexistent, o del qual l'estafador no té capacitat real per llogar-lo."},
      {nom:"Inversor online estafat",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"Es fa creure a la persona que està fent inversions reals que en realitat són fictícies."},
      {nom:"Càrrec a targeta bancària",art:"Art. 249.1b) i 2b) CP",artLeu:null,ambit:"Ciberfacilitadores",desc:"Per qualsevol dels sistemes esmentats es produeix un desplaçament patrimonial no consentit."},
      {nom:"Càrrec a compte bancari",art:"Art. 249.1b) i 2b) CP",artLeu:null,ambit:"Ciberfacilitadores",desc:"Per qualsevol dels sistemes esmentats es produeix un desplaçament patrimonial no consentit."},
      {nom:"Càrrec a BIZUM",art:"Art. 249.1b) i 2b) CP",artLeu:null,ambit:"Ciberfacilitadores",desc:"Sovint és resultat d'un engany previ en el qual la víctima creu estar rebent diners quan en realitat està autoritzant una transacció (Bizum invers)."},
      {nom:"Fals familiar",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"Per qualsevol mitjà, la víctima rep un missatge (escrit, veu, hipertrucatge…) que suposadament és d'un familiar —habitualment fill/a. Se li demanen diners amb qualsevol pretext."},
      {nom:"Alta de servei a nom de l'estafat",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"Es donen d'alta serveis (electricitat, telefonia…) o subscripcions (canals de pagament, revistes…) sense consentiment de la víctima. Prèviament els estafadors han aconseguit les dades/credencials necessàries."},
      {nom:"CEO / Fraude del CEO",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"L'estafador es fa passar per un càrrec directiu (comandament, no necessàriament CEO) per convèncer la víctima que faci un desplaçament patrimonial (de l'empresa i/o propi). Qualsevol pretext + urgència. Habitualment per veu o hipertrucatge."},
      {nom:"BEC — Business Email Compromise",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"L'estafador envia un correu electrònic fent-se passar per un treballador de l'empresa o proveïdor per aconseguir que l'empresa canviï el número de compte per als pagaments o faci un pagament immediat per transferència."},
      {nom:"Estafador de l'amor / Lovescam",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"L'estafador s'aprofita de les mancances socioafectives de la víctima. Sovint es fa passar per una persona famosa o amb una professió atractiva/misteriosa. Fingeix enamorament i sempre posposua el moment de la trobada presencial, demanant transferències amb qualsevol pretext."},
      {nom:"Falsa oferta de treball",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"La víctima rep un missatge de veu o text amb una falsa oferta de treball. Prèviament a aconseguir-lo, se li demanen quanties per motius diversos (matrícula, uniformitat…). També s'aplica als casos d'una suposada feina ben remunerada amb baix esforç on se li demana fer aportacions dineràries."},
      {nom:"Suplantació d'identitat",art:"Art. 248–251 bis CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Ciberfacilitadores",desc:"Qualsevol supòsit en el qual es suplanta la identitat d'una persona amb l'objectiu de provocar un engany suficient perquè la víctima faci una transferència monetària (moneda fiat o criptoactiu)."},
      {nom:"Phishing",art:"Art. 249.1a) i 2a) CP",artLeu:null,ambit:"Ciberfacilitadores",desc:"Per mitjà d'un correu electrònic fraudulent. Pesca de credencials i/o accés informàtic. Generalment fent clic a un enllaç o arxiu adjunt (pot ser qualsevol tipus de document, fins i tot una imatge que oculta un enllaç maliciós)."},
      {nom:"Smishing",art:"Art. 249.1a) i 2a) CP",artLeu:"Art. 249.1a) i 2a) CP (≤400€)",ambit:"Ciberfacilitadores",desc:"Per SMS o missatgeria social (WhatsApp, Telegram). Pesca de credencials i/o accés informàtic. Generalment fent clic a un enllaç o arxiu adjunt."},
      {nom:"Vishing",art:"Art. 248–251 bis CP",artLeu:"Art. 248–251 bis CP (≤400€)",ambit:"Ciberfacilitadores",desc:"Per trucada de veu (telefònica convencional o VoIP). L'objectiu és la pesca de credencials i/o accés informàtic, sovint per superar un 2FA. L'estafador es fa passar per seguretat o servei informàtic del banc. L'objectiu final és el desplaçament econòmic (accés directe o Bizum invers). *Finalitat: obtenir credencials per cometre ciberestafes."},
      {nom:"Smishing/Phishing + Vishing",art:"Art. 249.1a) i 2a) CP",artLeu:"Art. 249.1a) i 2a) CP (≤400€)",ambit:"Ciberfacilitadores",desc:"La combinació de qualsevol de les tècniques de pesca (phishing, smishing, vishing) amb qualsevol dels objectius finals (sostracció de credencials o codis amb l'objectiu d'obtenir un desplaçament patrimonial il·lícit)."},
    ]
  },
  {
    id:"basic", cls:"basic", nom:"Estafes Bàsiques",
    tipus:[
      {nom:"Posar combustible i marxar sense pagar",art:"Art. 248 CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"Posar el combustible i no abonar la càrrega."},
      {nom:"Consumir en bar/restaurant/hotel i marxar sense pagar",art:"Art. 248 CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"Fer qualsevol consumició o ús de servei i no voler pagar."},
      {nom:"Transport públic sense pagar",art:"Art. 248 CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"Fer servir transport públic (taxi, tren, tramvia, bus) i no pagar el servei."},
      {nom:"Canvi d'etiquetes (Scalping roba)",art:"Art. 248 CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"Quan el comprador d'un producte de manera física canvia l'etiqueta per una altra de menys cost."},
      {nom:"Scalping — distracció al caixer",art:"Art. 248 CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"Quan l'estafador ensarronar la víctima davant d'un caixer per treure diners sense que s'adoni."},
      {nom:"Falsos operaris de gas, llum, telefonia",art:"Art. 248 CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"Instal·ladors o gestors que, a canvi d'una suposada revisió o modificació de contracte, demanen diners i/o sostreuen joies."},
      {nom:"Rip Deal",art:"Art. 248 CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"Operació econòmica (compra d'immobles, rellotges, joies, criptomonedes…) on els criminals intenten un intercanvi previ de diners amb la víctima (facsímils). Diners que poden acabar sostreient o apropiant-se dels moneders digitals."},
      {nom:"Tocomotxo / Estampeta",art:"Art. 248 CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"L'estafador mostra una bossa que sembla plena de bitllets o una falsa butlleta de loteria premiada. Un còmplice intenta convèncer la víctima perquè faci el lliurament de diners a canvi."},
      {nom:"Xecs i/o pagarés falsos",art:"Art. 249.2b) i §3 CP",artLeu:"Art. 249.2b) i §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"Falsificació integral del xec/pagaré o alteració d'alguna de les dades essencials (import, beneficiari) perquè pugui cobrar els diners una tercera persona."},
      {nom:"Esquemes Ponzi / Estafes piramidals",art:"Art. 248 CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"Esquema de negoci en el qual no hi ha una activitat real, sinó que es paguen directament els presumibles beneficis dels inversors amb les aportacions d'altres inversors."},
      {nom:"Pèrdua/sostracció de targeta i ús posterior",art:"Art. 249.1b) i 2b) CP",artLeu:"Art. 249.1b) i 2b) CP (≤400€)",ambit:"Estafes bàsiques",desc:"D'una denúncia de pèrdua o sostracció d'una targeta de crèdit, es produeix posteriorment un ús no consentit en línia o físicament en un establiment."},
      {nom:"Trucada telefònica per obtenir codis de transferència",art:"Art. 248 CP",artLeu:"Art. 248 §3 CP (≤400€)",ambit:"Estafes bàsiques",desc:"Estafes comeses exclusivament per trucada telefònica, sol·licitant codis de validació de transferències quan la víctima pensa, per l'engany, que serveixen per denegar els moviments."},
    ]
  }
];

const DB = [];
SECCIONS.forEach(s => {
  s.tipus.forEach(t => {
    DB.push({seccioId:s.id, seccioCls:s.cls, seccioNom:s.nom, ...t});
  });
});

const fuse = new Fuse(DB, {
  keys:["nom","desc","art"],
  threshold:0.35,
  includeMatches:true,
  minMatchCharLength:2
});

const inp    = document.getElementById("search-input");
const btnClr = document.getElementById("btn-clear");
const statsTxt = document.getElementById("stats-txt");
const noRes  = document.getElementById("no-results");
const list   = document.getElementById("cards-list");
let timer = null;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function hlText(text, matches, key) {
  if (!matches) return esc(text);
  const m = matches.find(m => m.key === key);
  if (!m || !m.indices || !m.indices.length) return esc(text);
  let out = "", last = 0;
  m.indices.forEach(([s,e]) => {
    out += esc(text.slice(last,s)) + "<mark>" + esc(text.slice(s,e+1)) + "</mark>";
    last = e+1;
  });
  return out + esc(text.slice(last));
}

function render() {
  const q = inp.value.trim();
  btnClr.style.display = q ? "block" : "none";

  let data, isSearch = false;
  if (q.length >= 2) {
    isSearch = true;
    data = fuse.search(q).map(r => ({...r.item, _matches:r.matches}));
  } else {
    data = DB.map(d => ({...d, _matches:null}));
  }

  if (data.length === 0) {
    list.innerHTML = "";
    noRes.style.display = "block";
    statsTxt.textContent = "";
    return;
  }
  noRes.style.display = "none";

  const groups = new Map();
  data.forEach(d => {
    if (!groups.has(d.seccioId)) {
      groups.set(d.seccioId, {id:d.seccioId, cls:d.seccioCls, nom:d.seccioNom, items:[]});
    }
    groups.get(d.seccioId).items.push(d);
  });

  const total = data.length;
  statsTxt.textContent = isSearch
    ? `${total} tipologia${total===1?"":"s"} en ${groups.size} secció${groups.size===1?"":"ns"}`
    : `${total} tipologies`;

  let html = "";
  groups.forEach(grp => {
    const openClass = isSearch ? " open" : "";
    html += `<div class="acc-section${openClass} ${grp.cls}">
  <div class="acc-header" onclick="toggle(this)">
    <span class="acc-dot"></span>
    <span class="acc-title">${esc(grp.nom)}</span>
    <span class="acc-count">${grp.items.length}</span>
    <span class="acc-chevron">›</span>
  </div>
  <div class="acc-body"><div class="cards-grid">`;
    grp.items.forEach(d => {
      const artCls = d.seccioCls === "cyber" ? "art-cyber" : "art-basic";
      html += `<div class="est-card">
        <div class="est-header">
          <div class="est-nom">${hlText(d.nom, d._matches, "nom")}</div>
          <span class="est-art ${artCls}">${hlText(d.art, d._matches, "art")}</span>
        </div>
        <div class="est-desc">${hlText(d.desc, d._matches, "desc")}</div>
        <div class="est-tags">
          ${d.artLeu ? `<span class="tag tag-leu">⚠️ ${esc(d.artLeu)}</span>` : ""}
          <span class="tag">📂 ${esc(d.ambit)}</span>
        </div>
      </div>`;
    });
    html += `</div></div></div>`;
  });
  list.innerHTML = html;
}

function doSearch() { render(); }

function clearSearch() {
  inp.value = "";
  btnClr.style.display = "none";
  render();
}

function toggle(header) {
  header.parentElement.classList.toggle("open");
}

inp.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(render, 80);
});
inp.addEventListener("keydown", e => { if (e.key === "Enter") render(); });

render();
</script>
</body>
</html>
