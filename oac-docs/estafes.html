<title>Tipologies d'Estafes · OAC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>

<style>
:root {
  --blue:#1a3a6b; --blue2:#2d5a9e; --blue3:#e8f0fb;
  --gold:#e8a800; --gold2:#fff8e0;
  --bg:#f0f2f5; --card:#ffffff; --border:#dde4f0;
  --text:#1a1a2e; --muted:#6b7280;
  --cyber:#7c3aed; --cyber2:#ede9fe;
  --basic:#b45309; --basic2:#fef3c7;
  --red:#dc2626; --red2:#fee2e2;
  --tag-bg:#f1f5f9; --tag-text:#475569;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f172a; --card:#1e293b; --border:#2d3f5e;
    --text:#e2e8f0; --muted:#94a3b8; --blue3:#1e3a5f;
    --gold2:#2a2000; --cyber2:#1e1040; --basic2:#431407;
    --red2:#450a0a; --tag-bg:#1e293b; --tag-text:#94a3b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0f172a; --card:#1e293b; --border:#2d3f5e;
  --text:#e2e8f0; --muted:#94a3b8; --blue3:#1e3a5f;
  --gold2:#2a2000; --cyber2:#1e1040; --basic2:#431407;
  --red2:#450a0a; --tag-bg:#1e293b; --tag-text:#94a3b8;
  color-scheme: dark;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'Inter',Arial,sans-serif;color:var(--text);background:var(--bg)}

#header{
  background:var(--blue);
  padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
  position:sticky;top:0;z-index:100;
}
.hicon{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.htxt{flex:1;min-width:0}
.htxt h1{color:#fff;font-size:15px;font-weight:700;line-height:1.2}
.htxt p{color:#a8c4e8;font-size:10px;margin-top:2px}
#btn-back{flex-shrink:0;padding:7px 13px;border:none;border-radius:6px;background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s}
#btn-back:hover{background:rgba(255,255,255,.25)}

#toolbar{
  padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:var(--card);border-bottom:1px solid var(--border);
  position:sticky;top:60px;z-index:90;
}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#q{
  width:100%;padding:9px 14px 9px 36px;
  border:1.5px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);
  font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;
}
#q:focus{border-color:var(--blue2)}
#q::placeholder{color:var(--muted)}

main{padding:12px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
#statsbar{font-size:11px;color:var(--muted);margin-bottom:8px;min-height:16px}

.acc-section{margin-bottom:6px;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.acc-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;cursor:pointer;
  user-select:none;-webkit-user-select:none;transition:background .12s;
}
.acc-header:hover{background:var(--blue3)}
.acc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.acc-title{flex:1;font-size:13px;font-weight:700;color:var(--text)}
.acc-count{flex-shrink:0;font-size:11px;color:var(--muted);font-weight:500}
.acc-chevron{flex-shrink:0;color:var(--muted);font-size:14px;transition:transform .18s}
.acc-section.open .acc-chevron{transform:rotate(90deg)}

.cyber .acc-dot{background:var(--cyber)}
.basic .acc-dot{background:var(--basic)}

.acc-body{display:none;padding:0 10px 10px}
.acc-section.open .acc-body{display:block}
.cards-grid{display:flex;flex-direction:column;gap:6px;padding-top:6px}

.est-card{
  padding:10px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg);
  transition:border-color .12s;
}
.est-card:hover{border-color:var(--blue2)}

.est-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.est-nom{font-size:12px;font-weight:700;color:var(--text);flex:1;line-height:1.3}
.est-art{
  flex-shrink:0;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;
  white-space:nowrap;margin-top:1px;
}
.art-cyber{background:var(--cyber2);color:var(--cyber)}
.art-basic{background:var(--basic2);color:var(--basic)}
.art-red  {background:var(--red2);  color:var(--red)}

.est-desc{font-size:11px;color:var(--muted);line-height:1.45;margin-bottom:6px}

.est-tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{
  font-size:9px;font-weight:600;padding:2px 6px;border-radius:6px;
  background:var(--tag-bg);color:var(--tag-text);white-space:nowrap;
}
.tag-leu{background:var(--gold2);color:#7a4a00}

mark{background:rgba(232,168,0,.35);color:inherit;border-radius:2px;padding:0 1px}
#empty{display:none;text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}
footer{text-align:center;padding:0 16px 24px;font-size:10px;color:var(--muted);margin-top:8px}
</style>

<main>
  <div id="statsbar"></div>

        desc:"Fer servir transport públic (taxi, tren, tramvia, bus) i no pagar el servei."

      {

        art:"Art. 248 CP",
        artLeu:"Art. 248 §3 CP (≤400€)",
        ambit:"Estafes bàsiques",
        desc:"Estafes comeses exclusivament per trucada telefònica, sol·licitant codis de validació de transferències quan la víctima pensa, per l'engany, que serveixen per denegar els moviments."

// Aplana per a Fuse
const DB = [];
SECCIONS.forEach(s => {
  s.tipus.forEach(t => {
    DB.push({seccioId:s.id, seccioCls:s.cls, seccioNom:s.nom, ...t});
  });
});

const fuse = new Fuse(DB, {
  keys:["nom","desc","art"],
  threshold:0.35,
  includeMatches:true,
  minMatchCharLength:2
});

const qEl   = document.getElementById("q");
const res   = document.getElementById("results");
const empty = document.getElementById("empty");
const stats = document.getElementById("statsbar");
let timer   = null;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }

function hlText(text, matches, key) {
  if (!matches) return esc(text);
  const m = matches.find(m => m.key === key);
  if (!m || !m.indices || !m.indices.length) return esc(text);
  let out = "", last = 0;
  m.indices.forEach(([s,e]) => {
    out += esc(text.slice(last,s)) + "<mark>" + esc(text.slice(s,e+1)) + "</mark>";
    last = e+1;
  });
  out += esc(text.slice(last));
  return out;
}

function artClass(cls) {
  return cls === "cyber" ? "art-cyber" : "art-basic";
}

function render() {
  const q = qEl.value.trim();
  let data, isSearch = false;

  if (q.length >= 2) {
    isSearch = true;
    data = fuse.search(q).map(r => ({...r.item, _matches:r.matches}));
  } else {
    data = DB.map(d => ({...d, _matches:null}));
  }

  if (data.length === 0) {
    res.innerHTML = "";
    empty.style.display = "block";
    stats.textContent = "";
    return;
  }
  empty.style.display = "none";

  // Agrupa per secció
  const groups = new Map();
  data.forEach(d => {
    if (!groups.has(d.seccioId)) {
      groups.set(d.seccioId, {id:d.seccioId, cls:d.seccioCls, nom:d.seccioNom, items:[]});
    }
    groups.get(d.seccioId).items.push(d);
  });

  const total = data.length;
  stats.textContent = isSearch
    ? `${total} tipologia${total===1?"":"s"} en ${groups.size} secció${groups.size===1?"":"ns"}`
    : `${total} tipologies`;

  let html = "";
  groups.forEach(grp => {
    const openClass = isSearch ? " open" : "";
    html += `<div class="acc-section${openClass} ${grp.cls}">
  <div class="acc-header" onclick="toggle(this)">
    <span class="acc-dot"></span>
    <span class="acc-title">${esc(grp.nom)}</span>
    <span class="acc-count">${grp.items.length}</span>
    <span class="acc-chevron">›</span>
  </div>
  <div class="acc-body"><div class="cards-grid">`;

    grp.items.forEach(d => {
      const nomHtml  = isSearch ? hlText(d.nom,  d._matches, "nom")  : esc(d.nom);
      const descHtml = isSearch ? hlText(d.desc, d._matches, "desc") : esc(d.desc);
      const artHtml  = isSearch ? hlText(d.art,  d._matches, "art")  : esc(d.art);

      html += `<div class="est-card">
        <div class="est-header">
          <div class="est-nom">${nomHtml}</div>
          <span class="est-art ${artClass(d.seccioCls)}">${artHtml}</span>
        </div>
        <div class="est-desc">${descHtml}</div>
        <div class="est-tags">
          ${d.artLeu ? `<span class="tag tag-leu">⚠️ ${esc(d.artLeu)}</span>` : ""}
          <span class="tag">📂 ${esc(d.ambit)}</span>
        </div>
      </div>`;
    });

    html += `</div></div></div>`;
  });

  res.innerHTML = html;
}

function toggle(header) {
  header.parentElement.classList.toggle("open");
}

qEl.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(render, 80);
});

render();
</script>
