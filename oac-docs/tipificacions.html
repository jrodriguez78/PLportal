<style>
:root {
  --blue:#1a3a6b; --blue2:#2d5a9e; --blue3:#e8f0fb;
  --gold:#e8a800; --gold2:#fff8e0;

  --text:#1a1a2e; --muted:#6b7280;
  --green:#15803d; --green2:#dcfce7;
  --teal:#0f766e; --teal2:#ccfbf1;
  --purple:#5b21b6; --purple2:#ede9fe;
  --orange:#c2410c; --orange2:#ffedd5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f172a; --card:#1e293b; --border:#2d3f5e;
    --text:#e2e8f0; --muted:#94a3b8; --blue3:#1e3a5f;
    --gold2:#2a2000; --green2:#052e16; --teal2:#042f2e; --purple2:#1e1040; --orange2:#2d1200;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0f172a; --card:#1e293b; --border:#2d3f5e;
  --text:#e2e8f0; --muted:#94a3b8; --blue3:#1e3a5f;
  --gold2:#2a2000; --green2:#052e16; --teal2:#042f2e; --purple2:#1e1040; --orange2:#2d1200;
  color-scheme: dark;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'Inter',Arial,sans-serif;color:var(--text);background:var(--bg)}

/* Header */
#header{
  background:var(--blue);
  padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
  position:sticky;top:0;z-index:100;
}
.hicon{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.htxt{flex:1;min-width:0}
.htxt h1{color:#fff;font-size:15px;font-weight:700;line-height:1.2}
.htxt p{color:#a8c4e8;font-size:10px;margin-top:2px}
#btn-back{flex-shrink:0;padding:7px 13px;border:none;border-radius:6px;background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s}
#btn-back:hover{background:rgba(255,255,255,.25)}

/* Search + chips */
#toolbar{
  padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;top:60px;z-index:90;
}
.searchbox{position:relative;margin-bottom:8px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#q{
  width:100%;padding:9px 14px 9px 36px;
  border:1.5px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);
  font-size:14px;font-family:inherit;outline:none;
  transition:border-color .15s;
}
#q:focus{border-color:var(--blue2)}
#q::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:4px 11px;border-radius:20px;
  border:1.5px solid var(--border);background:var(--bg);
  color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.chip.active{border-color:var(--blue2);background:var(--blue3);color:var(--blue2)}
.chip-cp.active{border-color:var(--blue2);background:var(--blue3);color:var(--blue2)}
.chip-esp.active{border-color:var(--purple);background:var(--purple2);color:var(--purple)}
.chip-adm.active{border-color:var(--orange);background:var(--orange2);color:var(--orange)}
.chip-lsc.active{border-color:var(--teal);background:var(--teal2);color:var(--teal)}

/* Main */
main{padding:12px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}

/* Stats */
#statsbar{font-size:11px;color:var(--muted);margin-bottom:8px;min-height:16px}

/* Accordion */
.acc-section{margin-bottom:6px;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.acc-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  transition:background .12s;
}
.acc-header:hover{background:var(--blue3)}
.acc-badge{
  flex-shrink:0;font-size:9px;font-weight:700;letter-spacing:.05em;
  padding:2px 7px;border-radius:10px;white-space:nowrap;
}
.badge-cp{background:var(--blue3);color:var(--blue2)}
.badge-esp{background:var(--purple2);color:var(--purple)}
.badge-adm{background:var(--orange2);color:var(--orange)}
.badge-lsc{background:var(--teal2);color:var(--teal)}
.acc-title{flex:1;font-size:12px;font-weight:600;color:var(--text);min-width:0;line-height:1.3}
.acc-count{flex-shrink:0;font-size:11px;color:var(--muted);font-weight:500}
.acc-chevron{flex-shrink:0;color:var(--muted);font-size:14px;transition:transform .18s;line-height:1}
.acc-section.open .acc-chevron{transform:rotate(90deg)}

/* Cards grid */
.acc-body{display:none;padding:0 10px 10px}
.acc-section.open .acc-body{display:block}
.cards-grid{display:flex;flex-direction:column;gap:4px;padding-top:6px}

.tip-card{
  display:flex;align-items:center;gap:10px;
  padding:7px 10px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg);
  transition:border-color .12s,background .12s;
  cursor:default;
}
.tip-card:hover{border-color:var(--blue2);background:var(--blue3)}
.tip-art{
  flex-shrink:0;min-width:48px;text-align:center;
  font-size:10px;font-weight:700;letter-spacing:.03em;
  padding:3px 7px;border-radius:6px;
}
.art-cp{background:var(--blue3);color:var(--blue2)}
.art-esp{background:var(--purple2);color:var(--purple)}
.art-adm{background:var(--orange2);color:var(--orange)}
.art-lsc{background:var(--teal2);color:var(--teal)}
.art-empty{background:transparent;color:var(--muted);font-style:italic}
.tip-desc{flex:1;font-size:12px;color:var(--text);line-height:1.35;min-width:0}
mark{background:rgba(232,168,0,.35);color:inherit;border-radius:2px;padding:0 1px}

/* Empty */
#empty{display:none;text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}

footer{text-align:center;padding:0 16px 24px;font-size:10px;color:var(--muted);margin-top:8px}
</style>

// Fuse setup
const fuse = new Fuse(DB, {
  keys: ["desc","art","titol"],
  threshold: 0.35,
  includeMatches: true,
  minMatchCharLength: 2
});

let currentCat = "ALL";
let timer = null;
const qEl   = document.getElementById("q");
const res   = document.getElementById("results");
const empty = document.getElementById("empty");
const stats = document.getElementById("statsbar");

function catClass(c){
  return {CP:"cp",ESP:"esp",LSC:"lsc",ADM:"adm"}[c]||"cp";
}
function badgeLabel(c){
  return {CP:"CP",ESP:"ESP",LSC:"LSC",ADM:"ADM"}[c]||c;
}

function setCat(el, cat) {
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  currentCat = cat;
  render();
}

function hlText(text, matches, key) {
  if (!matches) return esc(text);
  const m = matches.find(m => m.key === key);
  if (!m || !m.indices || !m.indices.length) return esc(text);
  let out = "", last = 0;
  m.indices.forEach(([s,e]) => {
    out += esc(text.slice(last,s)) + "<mark>" + esc(text.slice(s,e+1)) + "</mark>";
    last = e+1;
  });
  out += esc(text.slice(last));
  return out;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }

function render() {
  const q = qEl.value.trim();
  let data, isSearch = false;

  if (q.length >= 2) {
    isSearch = true;
    data = fuse.search(q).map(r => ({...r.item, _matches: r.matches}));
  } else {
    data = DB.map(d => ({...d, _matches: null}));
  }

  // filter by cat
  if (currentCat !== "ALL") data = data.filter(d => d.cat === currentCat);

  // group by titol
  const groups = new Map();
  data.forEach(d => {
    if (!groups.has(d.titol)) groups.set(d.titol, {cat: d.cat, items: []});
    groups.get(d.titol).items.push(d);
  });

  if (groups.size === 0) {
    res.innerHTML = "";
    empty.style.display = "block";
    stats.textContent = "";
    return;
  }
  empty.style.display = "none";

  const total = data.length;
  const sectCount = groups.size;
  if (q.length >= 2) {
    stats.textContent = `${total} tipificació${total===1?"":"ns"} en ${sectCount} secció${sectCount===1?"":"ns"}`;
  } else {
    stats.textContent = `${total} tipificacions · ${sectCount} seccions`;
  }

  let html = "";
  let idx = 0;
  groups.forEach((grp, titol) => {
    const cls = catClass(grp.cat);
    const isFirst = idx === 0;
    const openIfSearch = isSearch; // expand all when searching
    html += `<div class="acc-section${openIfSearch?" open":""}">
  <div class="acc-header" onclick="toggle(this)">
    <span class="acc-badge badge-${cls}">${badgeLabel(grp.cat)}</span>
    <span class="acc-title">${esc(titol)}</span>
    <span class="acc-count">${grp.items.length}</span>
    <span class="acc-chevron">›</span>
  </div>
  <div class="acc-body">
    <div class="cards-grid">`;
    grp.items.forEach(d => {
      const artLabel = d.art || "—";
      const artCls   = d.art ? `art-${cls}` : "art-empty";
      const descHtml = isSearch ? hlText(d.desc, d._matches, "desc") : esc(d.desc);
      html += `<div class="tip-card">
        <span class="tip-art ${artCls}">${esc(artLabel)}</span>
        <span class="tip-desc">${descHtml}</span>
      </div>`;
    });
    html += `</div></div></div>`;
    idx++;
  });

  res.innerHTML = html;
}

function toggle(header) {
  const section = header.parentElement;
  section.classList.toggle("open");
}

qEl.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(render, 80);
});

render();
</script>
