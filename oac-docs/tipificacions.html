<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a3a6b">
<title>Tipificacions · OAC</title>

<style>
:root {
  --blue:   #1a3a6b;
  --blue2:  #2d5a9e;
  --blue3:  #e8f0fb;
  --gold:   #e8a800;
  --bg:     #f0f2f5;
  --card:   #ffffff;
  --border: #dde4f0;
  --text:   #1a1a2e;
  --muted:  #6b7280;

  /* badge colours by category */
  --cp:    #1a3a6b; --cp2:  #e8f0fb;
  --esp:   #6d28d9; --esp2: #ede9fe;
  --adm:   #b45309; --adm2: #fef3c7;
  --lsc:   #0f766e; --lsc2: #ccfbf1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:     #0f172a;
    --card:   #1e293b;
    --border: #2d3f5e;
    --text:   #e2e8f0;
    --muted:  #94a3b8;
    --blue3:  #1e3a5f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:     #0f172a;
  --card:   #1e293b;
  --border: #2d3f5e;
  --text:   #e2e8f0;
  --muted:  #94a3b8;
  --blue3:  #1e3a5f;
  color-scheme: dark;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:Arial,sans-serif;color:var(--text);}
body{background:var(--bg);display:flex;flex-direction:column;}

/* ── Header ── */
#header{
  background:var(--blue);
  padding:12px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
  flex-shrink:0;
}
.hdr-icon{
  width:34px;height:34px;border-radius:8px;
  background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;
}
.hdr-text{flex:1;min-width:0;}
.hdr-text h1{color:#fff;font-size:14px;font-weight:700;line-height:1.2;}
.hdr-text p{color:#a8c4e8;font-size:10px;margin-top:1px;}
#btn-back{
  flex-shrink:0;padding:6px 12px;border:none;border-radius:6px;
  background:rgba(255,255,255,.15);color:#fff;
  font-size:11px;font-weight:600;cursor:pointer;
  text-decoration:none;white-space:nowrap;
}
#btn-back:hover{background:rgba(255,255,255,.25);}

/* ── Search ── */
#search-wrap{
  background:#fff;
  padding:10px 14px 8px;
  flex-shrink:0;
  border-bottom:1px solid var(--border);
}
.sbox{display:flex;gap:6px;align-items:center;}
#search-input{
  flex:1;padding:11px 14px;
  font-size:16px;font-family:Arial,sans-serif;
  border:1.5px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);
  outline:none;min-width:0;
}
#search-input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(45,90,158,.15);}
#btn-clear{
  display:none;padding:10px 12px;border:none;border-radius:8px;
  background:#f1f5f9;color:var(--muted);font-size:14px;cursor:pointer;
  flex-shrink:0;
}
#btn-clear:hover{background:#e2e8f0;}
#btn-search{
  padding:10px 16px;border:none;border-radius:8px;
  background:var(--blue);color:#fff;
  font-size:13px;font-weight:700;cursor:pointer;
  flex-shrink:0;white-space:nowrap;
}
#btn-search:hover{background:var(--blue2);}

/* ── Chip filter ── */
#chip-wrap{
  background:#fff;
  padding:0 14px 10px;
  flex-shrink:0;
  border-bottom:1px solid var(--border);
  display:flex;gap:6px;flex-wrap:wrap;
}
.chip{
  padding:5px 11px;border:1.5px solid var(--border);border-radius:20px;
  font-size:11px;font-weight:700;cursor:pointer;
  background:var(--bg);color:var(--muted);
  white-space:nowrap;transition:all .15s;
}
.chip.active-all  {background:var(--blue);border-color:var(--blue);color:#fff;}
.chip.active-cp   {background:var(--cp);border-color:var(--cp);color:#fff;}
.chip.active-esp  {background:var(--esp);border-color:var(--esp);color:#fff;}
.chip.active-adm  {background:var(--adm);border-color:var(--adm);color:#fff;}
.chip.active-lsc  {background:var(--lsc);border-color:var(--lsc);color:#fff;}

/* ── Stats bar ── */
#stats-bar{
  padding:4px 14px;
  font-size:11px;color:var(--muted);
  background:var(--bg);
  flex-shrink:0;min-height:24px;
  display:flex;align-items:center;
}

/* ── Results scrollable ── */
#view-results{
  flex:1;overflow-y:auto;
  padding:10px 14px 40px;
  -webkit-overflow-scrolling:touch;
}

/* ── No results ── */
#no-results{
  display:none;
  text-align:center;padding:40px 20px;
  color:var(--muted);font-size:14px;
}

/* ── Accordion ── */
.acc-section{
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:10px;
  margin-bottom:8px;
  overflow:hidden;
}
.acc-header{
  display:flex;align-items:center;gap:8px;
  padding:12px 14px;
  cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
.acc-header:hover{background:rgba(0,0,0,.03);}
.acc-badge{
  flex-shrink:0;
  font-size:9px;font-weight:700;letter-spacing:.05em;
  padding:3px 7px;border-radius:10px;
}
.badge-cp  {background:var(--cp2);color:var(--cp);}
.badge-esp {background:var(--esp2);color:var(--esp);}
.badge-adm {background:var(--adm2);color:var(--adm);}
.badge-lsc {background:var(--lsc2);color:var(--lsc);}

.acc-title{flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--text);line-height:1.3;}
.acc-count{
  flex-shrink:0;
  font-size:10px;font-weight:700;color:var(--muted);
  background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:2px 7px;
}
.acc-chevron{flex-shrink:0;color:var(--muted);font-size:16px;transition:transform .2s;}
.acc-section.open .acc-chevron{transform:rotate(90deg);}

.acc-body{display:none;padding:0 12px 12px;}
.acc-section.open .acc-body{display:block;}

/* ── Cards grid ── */
.cards-grid{display:flex;flex-direction:column;gap:6px;}
.tip-card{
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 10px;
  border-radius:7px;
  background:var(--bg);
  border:1px solid var(--border);
}
.tip-art{
  flex-shrink:0;
  font-size:10px;font-weight:700;letter-spacing:.03em;
  padding:3px 8px;border-radius:8px;
  white-space:nowrap;
  margin-top:1px;
}
.art-cp   {background:var(--cp2);color:var(--cp);}
.art-esp  {background:var(--esp2);color:var(--esp);}
.art-adm  {background:var(--adm2);color:var(--adm);}
.art-lsc  {background:var(--lsc2);color:var(--lsc);}
.art-empty{background:#f1f5f9;color:var(--muted);}
.tip-desc{font-size:13px;color:var(--text);line-height:1.4;flex:1;min-width:0;}
mark{background:#fff176;border-radius:2px;padding:0 1px;}
</style>
</head>
<body>

<div id="header">
  <div class="hdr-icon">⚖️</div>
  <div class="hdr-text">
    <h1>Tipificacions</h1>
    <p>CP · Penal especial · LSC · Administratiu</p>
  </div>
  <a id="btn-back" href="index.html">← Inici</a>
</div>

<div id="search-wrap">
  <div class="sbox">
    <input type="text" id="search-input" placeholder="Cerca tipificació…"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           oninput="onInput()" onkeydown="if(event.key==='Enter')doSearch()">
    <button id="btn-clear" onclick="clearSearch()">✕</button>
    <button id="btn-search" onclick="doSearch()">Cerca</button>
  </div>
</div>

<div id="chip-wrap">
  <span class="chip active-all" data-cat="ALL" onclick="setCat(this,'ALL')">Tots</span>
  <span class="chip" data-cat="CP"  onclick="setCat(this,'CP')">Codi Penal</span>
  <span class="chip" data-cat="ESP" onclick="setCat(this,'ESP')">Penal Especial</span>
  <span class="chip" data-cat="LSC" onclick="setCat(this,'LSC')">LSC 4/15</span>
  <span class="chip" data-cat="ADM" onclick="setCat(this,'ADM')">Administratiu</span>
</div>

<div id="stats-bar"><span id="stats-txt"></span></div>

<div id="view-results">
  <div id="no-results">Cap tipificació trobada per aquesta cerca.</div>
  <div id="cards-list"></div>
</div>

const fuse = new Fuse(DB, {
  keys: ["desc","art","titol"],
  threshold: 0.35,
  includeMatches: true,
  minMatchCharLength: 2
});

let currentCat = "ALL";
let pendingSearch = false;

function catClass(c){ return {CP:"cp",ESP:"esp",LSC:"lsc",ADM:"adm"}[c]||"cp"; }
function badgeLabel(c){ return {CP:"CP",ESP:"ESP",LSC:"LSC",ADM:"ADM"}[c]||c; }

function setCat(el, cat) {
  document.querySelectorAll(".chip").forEach(c => {
    c.className = "chip";
  });
  el.classList.add("active-" + (cat==="ALL"?"all":cat.toLowerCase()));
  currentCat = cat;
  render();
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function hlText(text, matches, key) {
  if (!matches) return esc(text);
  const m = matches.find(m => m.key === key);
  if (!m || !m.indices || !m.indices.length) return esc(text);
  let out = "", last = 0;
  const sorted = [...m.indices].sort((a,b) => a[0]-b[0]);
  sorted.forEach(([s,e]) => {
    if (s >= last) {
      out += esc(text.slice(last,s)) + "<mark>" + esc(text.slice(s,e+1)) + "</mark>";
      last = e+1;
    }
  });
  out += esc(text.slice(last));
  return out;
}

function onInput() {
  const q = document.getElementById("search-input").value;
  document.getElementById("btn-clear").style.display = q ? "block" : "none";
  pendingSearch = true;
}

function doSearch() {
  pendingSearch = false;
  render();
}

function clearSearch() {
  document.getElementById("search-input").value = "";
  document.getElementById("btn-clear").style.display = "none";
  pendingSearch = false;
  render();
}

function toggle(header) {
  header.parentElement.classList.toggle("open");
}

function render() {
  const q = document.getElementById("search-input").value.trim();
  const isSearch = q.length >= 2;
  let data;

  if (isSearch) {
    data = fuse.search(q).map(r => ({...r.item, _matches: r.matches}));
  } else {
    data = DB.map(d => ({...d, _matches: null}));
  }

  if (currentCat !== "ALL") data = data.filter(d => d.cat === currentCat);

  // group by titol
  const groups = new Map();
  data.forEach(d => {
    if (!groups.has(d.titol)) groups.set(d.titol, {cat: d.cat, items: []});
    groups.get(d.titol).items.push(d);
  });

  const noRes = document.getElementById("no-results");
  const cardsList = document.getElementById("cards-list");
  const statsTxt = document.getElementById("stats-txt");

  if (groups.size === 0) {
    cardsList.innerHTML = "";
    noRes.style.display = "block";
    statsTxt.textContent = "";
    return;
  }
  noRes.style.display = "none";

  const total = data.length;
  const sectCount = groups.size;
  if (isSearch) {
    statsTxt.textContent = `${total} tipificació${total===1?"":"ns"} en ${sectCount} secció${sectCount===1?"":"ns"}`;
  } else {
    statsTxt.textContent = `${total} tipificacions · ${sectCount} seccions`;
  }

  let html = "";
  groups.forEach((grp, titol) => {
    const cls = catClass(grp.cat);
    html += `<div class="acc-section${isSearch?" open":""}">
  <div class="acc-header" onclick="toggle(this)">
    <span class="acc-badge badge-${cls}">${badgeLabel(grp.cat)}</span>
    <span class="acc-title">${esc(titol)}</span>
    <span class="acc-count">${grp.items.length}</span>
    <span class="acc-chevron">›</span>
  </div>
  <div class="acc-body"><div class="cards-grid">`;
    grp.items.forEach(d => {
      const artLabel = d.art || "—";
      const artCls   = d.art ? `art-${cls}` : "art-empty";
      const descHtml = isSearch ? hlText(d.desc, d._matches, "desc") : esc(d.desc);
      html += `<div class="tip-card">
      <span class="tip-art ${artCls}">${esc(artLabel)}</span>
      <span class="tip-desc">${descHtml}</span>
    </div>`;
    });
    html += `</div></div></div>`;
  });

  cardsList.innerHTML = html;
}

render();
</script>
